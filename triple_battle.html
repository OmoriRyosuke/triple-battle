<title>トリプルバトル</title>
<style>
  body { font-family:"Hiragino Sans","Meiryo",sans-serif; background:#1a1d24; color:#e8e8e8; margin:0; padding:14px; font-size:14px; }
  h1{font-size:20px;text-align:center;margin:6px 0 12px;} h2{font-size:16px;margin:10px 0 6px;} h3{font-size:14px;margin:8px 0 4px;color:#b8c0d0;}
  .screen{max-width:980px;margin:0 auto;}
  button{background:#3a4254;color:#e8e8e8;border:1px solid #5a6478;border-radius:6px;padding:7px 11px;margin:3px;cursor:pointer;font-size:13px;}

  button:disabled{opacity:.35;cursor:default;}
  .pickslots{display:flex;gap:6px;flex-wrap:wrap;min-height:34px;align-items:center;margin-bottom:6px;}
  .pickslot{min-width:120px;display:inline-block;}
  .pickslot.empty{opacity:.45;}
  .hdrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .statsbtn{font-size:12px;padding:3px 8px;}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px;}
  .benchline{flex:1;text-align:center;}
  .calcbox{width:min(1100px,96vw);}
  .calcwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;}
  .calcleft{flex:1 1 340px;min-width:280px;}
  .calcright{flex:1 1 420px;min-width:300px;}
  .crow{margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .crow input[type=range]{flex:1;min-width:140px;}
  .crow select{background:#12141a;color:#e8e8e8;border:1px solid #444c60;border-radius:4px;padding:2px 4px;}
  .filters select{background:#12141a;color:#e8e8e8;border:1px solid #444c60;border-radius:4px;padding:2px 4px;}
  .statsbox{background:#1a1d26;border:1px solid #444c60;border-radius:6px;padding:12px;max-width:96vw;max-height:86vh;overflow:auto;}
  .tblwrap{overflow-x:auto;}
  table.stats{border-collapse:collapse;font-size:12px;width:100%;}
  table.stats th,table.stats td{border:1px solid #3a4152;padding:3px 6px;text-align:center;white-space:nowrap;}
  table.stats td.nmcell{text-align:left;font-weight:bold;}
  table.stats tr.faint{opacity:.45;}
  .roster{display:flex;flex-wrap:wrap;} .roster button{width:calc(20% - 12px);text-align:left;font-size:12px;}
  .panel{background:#252a36;border:1px solid #444c60;border-radius:8px;padding:12px;margin:10px 0;}
  .note{font-size:12px;color:#9aa4b8;} .warn{color:#e0b040;font-size:12px;}
  .tag{display:inline-block;background:#3a4254;border-radius:4px;padding:1px 6px;font-size:11px;margin:2px 3px 2px 0;}
  input[type=text]{background:#12141a;color:#e8e8e8;border:1px solid #444c60;border-radius:4px;padding:6px;font-size:14px;}
  input[type=number]{background:#12141a;color:#e8e8e8;border:1px solid #444c60;border-radius:4px;padding:4px;width:52px;font-size:14px;}
  select{background:#12141a;color:#e8e8e8;border:1px solid #444c60;border-radius:4px;padding:6px;font-size:13px;}
  table.evt{border-collapse:collapse;} table.evt td,table.evt th{padding:3px 8px;font-size:13px;text-align:center;}
  .board{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
  .row{display:flex;gap:8px;justify-content:center;}
  .slot{width:190px;min-height:92px;background:#252a36;border:1px solid #444c60;border-radius:8px;padding:7px;}
  .slot .pos{font-size:11px;color:#9aa4b8;} .slot .nm{font-weight:bold;font-size:14px;margin:1px 0;} .slot .tp{font-size:11px;color:#b8c0d0;}
  .hpbar{height:8px;background:#3a2020;border-radius:4px;margin-top:5px;overflow:hidden;} .hpbar div{height:100%;background:#4caf7d;}
  .hpbar div.low{background:#e0b040;} .hpbar div.crit{background:#d05050;}
  .hpnum{font-size:11px;color:#9aa4b8;margin-top:2px;} .slot.dead{opacity:.35;} .slot.acting{border-color:#e0b040;box-shadow:0 0 0 1px #e0b040;}
  .st{display:inline-block;border-radius:3px;padding:0 4px;font-size:10px;margin-left:4px;}
  .st.brn{background:#a04030;} .st.psn{background:#7a3a8a;} .st.par{background:#9a8a20;} .st.slp{background:#607080;} .st.frz{background:#3a7a9a;} .st.mega{background:#8a3a6a;}
  #log{background:#12141a;border:1px solid #333a4a;border-radius:8px;padding:10px;font-size:13px;line-height:1.65;max-height:300px;overflow-y:auto;white-space:pre-wrap;margin-top:10px;}
  .overlay{position:fixed;inset:0;background:rgba(20,22,28,0.98);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px;}
  .overlay p{font-size:18px;}
  .mvbtn{width:calc(50% - 10px);text-align:left;}
  button.tfoe{background:#7d2e2e;border-color:#a05050;}
  button.tally{background:#2e567d;border-color:#5080a0;}
  .teamslot{display:inline-block;background:#2c3140;border:1px solid #444c60;border-radius:6px;padding:6px 10px;margin:3px;min-width:130px;font-size:12px;vertical-align:top;cursor:pointer;}
  .teamslot:hover{border-color:#7a8498;}
  label.chk{display:inline-block;background:#2c3140;border:1px solid #444c60;border-radius:6px;padding:5px 8px;margin:3px;cursor:pointer;font-size:12px;width:calc(33% - 12px);}
  label.chk.on{background:#2e7d4f;border-color:#4caf7d;}
  label.chk input{margin-right:4px;}
</style>

/* =============== ステータス計算 =============== */
function calcStats(dexIdx, ev, mega, nat){
  const d=DEX[dexIdx]; const bs=(mega&&mega.bs)?mega.bs:((mega&&d.mega)?d.mega.bs:d.bs);
  const st={ h:bs[0]+75+(ev.h||0), a:bs[1]+20+(ev.a||0), b:bs[2]+20+(ev.b||0), c:bs[3]+20+(ev.c||0), d:bs[4]+20+(ev.d||0), s:bs[5]+20+(ev.s||0) };
  if(nat&&nat.plus!==nat.minus){
    if(nat.plus&&nat.plus!=="none"&&st[nat.plus]!==undefined) st[nat.plus]=Math.floor(st[nat.plus]*1.1);
    if(nat.minus&&nat.minus!=="none"&&st[nat.minus]!==undefined) st[nat.minus]=Math.floor(st[nat.minus]*0.9);
  }
  if(d.hp1)st.h=1;
  return st;
}
function megaFor(mon){
  const d=DEX[mon.dex];
  if(d.mega&&mon.item===d.mega.stone)return d.mega;
  if(d.mega2&&mon.item===d.mega2.stone)return d.mega2;
  return null;
}
function boostMul(st){ return st>=0 ? (2+st)/2 : 2/(2-st); }

function loadTeams(){
  try{
    const ts=JSON.parse(localStorage.getItem("tb_teams")||"[]");
    // 図鑑に新ポケモンが増えても崩れないよう、保存された名前から番号を引き直す
    ts.forEach(t=>{ (t.mons||[]).forEach(m=>{
      // 引き当ては ID → 名前 → 番号 の順。番号は最後の手段で、当てた瞬間に名前を刻んで二度とずれないようにする
      let i=-1;
      if(m.cid) i=DEX.findIndex(d=>d.cid===m.cid);
      if(i<0&&m.n) i=DEX.findIndex(d=>d.n===m.n);
      if(i<0&&!m.n&&!m.cid&&DEX[m.dex]) i=m.dex;
      m.dex=i;
      const dd=DEX[i];
      if(dd){ m.n=dd.n; if(dd.cid)m.cid=dd.cid; }
      // 図鑑側で特性が差し替わった場合、保存された古い特性を第1特性に戻す
      const d=DEX[m.dex];
      if(d&&m.ability&&!d.abil.some(a=>a[0]===m.ability)) m.ability=d.abil[0][0];
      // 同様に、覚えられなくなった技も落とす
      if(d&&!d.allMoves&&Array.isArray(m.moves)) m.moves=m.moves.filter(n=>MOVES[n]);
    }); });
    return ts;
  }catch(e){return [];}
}
function saveTeams(ts){
  try{
    (ts||[]).forEach(t=>{ (t.mons||[]).forEach(m=>{
      const d=DEX[m.dex];
      if(d){ m.n=d.n; if(d.cid)m.cid=d.cid; else delete m.cid; }
    }); });
    localStorage.setItem("tb_teams",JSON.stringify(ts));
  }catch(e){alert("保存に失敗しました（ブラウザのlocalStorageが使えない環境かもしれません）");}
}
function newCid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function loadCustom(){
  try{
    const l=JSON.parse(localStorage.getItem("tb_customdex")||"[]");
    // 図鑑の並びが変わっても見失わないよう、IDのない古いカスタムにIDを振る
    let changed=false;
    l.forEach(c=>{ if(!c.cid){ c.cid=newCid(); changed=true; } });
    if(changed)saveCustomDex(l);
    return l;
  }catch(e){return [];}
}

function kanaNorm(s){ return String(s||"").replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).toLowerCase(); }
window.filterEls=function(inp,contId,searchOnly){
  const q=inp.value; const c=document.getElementById(contId); if(!c||!c.children)return;
  [...c.children].forEach(el=>{
    if(!el.getAttribute)return;
    const nm=el.getAttribute("data-n");
    if(nm===null||nm===undefined)return;
    if(searchOnly&&!q){ el.style.display="none"; return; }
    el.style.display=(!q||kanaNorm(nm).includes(kanaNorm(q)))?"":"none";
  });
};

function applySearchFilters(){

function dispName(cfg){ return DEX[cfg.dex] ? DEX[cfg.dex].n : `${cfg.n||"？"}（削除済み）`; }
function teamBroken(t){ return (t.mons||[]).some(m=>!DEX[m.dex]); }
/* 保存された技がそのポケモンの覚える技に無い＝別個体に化けた疑い */
function monMismatch(m){
  const d=DEX[m.dex];
  if(!d||d.allMoves)return false;
  const learn=(d.mv||[]).map(x=>x[0]);
  return (m.moves||[]).some(n=>!learn.includes(n));
}
function teamSuspect(t){ return (t.mons||[]).some(monMismatch); }
function suspectNames(t){ return (t.mons||[]).filter(monMismatch).map(m=>m.n||"？"); }
function collectData(){
  return {v:1, savedAt:new Date().toISOString(), teams:loadTeams(), customDex:loadCustom(), customMoves:loadCustomMoves()};

window.downloadData=function(){
  try{

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="triple_battle_data.json";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
  }catch(e){ alert("ファイル保存に失敗しました。「データを書き出す」でテキストをコピーしてください。"); }
};
function applyImport(txt){
  let d;

  if(!d||typeof d!=="object"||!d.teams){ alert("このデータには保存内容が入っていません"); return; }
  const nT=(d.teams||[]).length, nD=(d.customDex||[]).length, nM=(d.customMoves||[]).length;
  if(!confirm(`チーム${nT}件・カスタムポケモン${nD}件・カスタム技${nM}件を読み込みます。現在のデータは上書きされます。よろしいですか？`))return;
  saveTeams(d.teams||[]);
  saveCustomDex(d.customDex||[]);
  saveCustomMoves(d.customMoves||[]);
  alert("読み込みました。ページを再読み込みします。");

}

/* =============== チーム編成 =============== */
function defaultCfg(di){
  const d=DEX[di];
  const mv=d.mv.slice(0,4).map(x=>x[0]);
  const ev={h:0,a:0,b:0,c:0,d:0,s:0};
  if(d.bs[1]>=d.bs[3]){ev.a=32;}else{ev.c=32;}
  if(d.bs[5]>=80){ev.s=32; ev.h=2;} else {ev.h=32; ev.b=2;}
  const plus = d.bs[1]>=d.bs[3] ? "a" : "c";
  const minus = plus==="a" ? "c" : "a";
  return {dex:di, n:d.n, ability:d.abil[0][0], moves:mv, item:(d.items[0]?d.items[0][0]:"なし"), ev, plus, minus};
}
function rBuilder(app){
  const T=S.team;
  let html=`<h1>チーム編成</h1><div>
   <button onclick="goMenu()">← メニューへ</button>
   チーム名: <input type="text" id="tname" value="${esc(T.name)}" onchange="S.team.name=this.value">
   <button class="sel" ${T.mons.length===6?"":"disabled"} onclick="saveTeam()">このチームを保存</button>
   ${T.mons.length<6?`<span class="warn">あと${6-T.mons.length}体選んでください</span>`:""}
  </div><div class="panel"><h2>メンバー（${T.mons.length}/6）クリックで編集</h2>`;
  T.mons.forEach((m,i)=>{
    const d=DEX[m.dex];
    html+=`<div class="teamslot" onclick="editMon(${i})"><b>${esc(d.n)}</b>${d.mega?'<span class="st mega">メガ可</span>':""}<br>
     <span class="note">${esc(m.ability)} / ${esc(m.item)}</span><br><span class="note">${m.moves.map(esc).join("・")}</span><br>
     <span class="note">努力値 ${STATKEYS.filter(k=>m.ev[k]>0).map(k=>STATN[k]+m.ev[k]).join(" ")||"なし"}${m.plus&&m.plus!=="none"?" "+STATN[m.plus]+"↑":""}${m.minus&&m.minus!=="none"?STATN[m.minus]+"↓":""}</span></div>`;
  });
  if(T.mons.length>0) html+=`<div class="note">※編集画面から外すこともできます</div>`;
  html+=`</div>`;
  if(S.srcIdx!==null){ html+=monEditor(); }
  else {
    const sortKey=S.roSort||"dex", sortDir=S.roDir||"desc", typeF=S.roType||"";
    const bstOf=d=>d.bs.reduce((a,b)=>a+b,0);
    let list=DEX.map((d,i)=>({d,i}));
    if(typeF) list=list.filter(x=>x.d.t.includes(typeF));
    if(sortKey!=="dex"){
      const val=x=> sortKey==="bst" ? bstOf(x.d) : x.d.bs[STATKEYS.indexOf(sortKey)];
      list.sort((a,b)=> sortDir==="desc" ? val(b)-val(a) || a.i-b.i : val(a)-val(b) || a.i-b.i );
    }
    const opt=(v,label,cur)=>`<option value="${v}" ${cur===v?"selected":""}>${label}</option>`;
    html+=`<div class="panel"><h2>${TX("add_mon")}</h2>
     <div class="filters">
      <span>${TX("search")}: <input type="text" id="monsearch" placeholder="${TX("mon_ph")}" oninput="S.qMon=this.value;filterEls(this,'rosterlist')" style="width:170px;"></span>
      <span>${TX("type_f")}: <select onchange="S.roType=this.value;render()">${opt("",TX("all_types"),typeF)}${Object.keys(CHART).map(t=>opt(t,t,typeF)).join("")}</select></span>
      <span>${TX("sort_f")}: <select onchange="S.roSort=this.value;render()">${opt("dex",TX("sort_dex"),sortKey)}${opt("bst",TX("sort_bst"),sortKey)}${STATKEYS.map(k=>opt(k,TX("statname",k),sortKey)).join("")}</select>
       <button class="${sortDir==="desc"?"sel":""}" ${sortKey==="dex"?"disabled":""} onclick="S.roDir='desc';render()">${TX("desc")}</button><button class="${sortDir==="asc"?"sel":""}" ${sortKey==="dex"?"disabled":""} onclick="S.roDir='asc';render()">${TX("asc")}</button></span>
      <span class="note">${TX("hits",list.length)}</span>
     </div><div class="roster" id="rosterlist">`;
    list.forEach(({d,i})=>{
      const used=T.mons.some(m=>m.dex===i);
      const num = sortKey==="dex" ? "" : `<span class="note"> ${sortKey==="bst"?bstOf(d):d.bs[STATKEYS.indexOf(sortKey)]}</span>`;
      html+=`<button data-n="${esc(d.n)}" ${used||T.mons.length>=6?"disabled":""} onclick="addMon(${i})">${esc(d.n)}${d.mega?" ⓜ":""}${d.est?" ★":""}${d.custom?" ✎":""}${num}<br><span class="note">${d.t.join("/")}</span></button>`;
    });
    html+=`</div><div class="note">ⓜ=メガシンカ可能 ★=使用率データなし（推定型） ✎=カスタム</div></div>`;
    html+=customPanel();
  }
  app.innerHTML=html;
}

function evTotal(ev){ return STATKEYS.reduce((s,k)=>s+(ev[k]||0),0); }
function monEditor(){
  const m=S.team.mons[S.srcIdx]; const d=DEX[m.dex];
  const st=calcStats(m.dex,m.ev,false,{plus:m.plus,minus:m.minus});
  const stM=d.mega?calcStats(m.dex,m.ev,true,{plus:m.plus,minus:m.minus}):null;
  const rest=66-evTotal(m.ev);
  let html=`<div class="panel"><h2>${esc(d.n)} の育成 <button onclick="closeEditor()" class="sel">完了</button> <button class="danger" onclick="removeMon()">チームから外す</button></h2>`;
  html+=`<h3>特性</h3>`;
  d.abil.forEach(a=>{
    html+=`<button class="${effAbility(m)===a[0]?"sel":""}" onclick="setAbil('${a[0]}')">${a[0]}${a[1]!==null?` <span class="note">${a[1]}%</span>`:""}</button>`;
  });
  if(d.mega) html+=`<div class="note">メガシンカ後は「${d.mega.abil}」に変化（${d.mega.stone}を持たせると戦闘中にメガシンカ可能）</div>`;
  html+=`<h3>技（最大4つ / 使用率順）</h3>検索: <input type="text" id="mvsearch" placeholder="技名（ひらがな可）" oninput="S.qMove=this.value;filterMoves(this)" style="width:180px;"><div id="mvlist">`;
  d.mv.forEach(mv=>{
    const name=mv[0]; const on=m.moves.includes(name); const M=MOVES[name];
    const info=M.cat==="X"?"変化":`${M.t} ${M.cat==="P"?"物理":"特殊"} 威力${M.p}`;
    html+=`<label data-n="${name}" class="chk ${on?"on":""}"><input type="checkbox" ${on?"checked":""} onchange="toggleMove('${name}')">${name}${mv[1]!==null?` <span class="note">${mv[1]}%</span>`:""}<br><span class="note">${info}${M.acc?` 命中${M.acc}`:" 必中"}${rangeNote(M)}</span></label>`;
  });
  html+=`</div><div class="note">▼ 追加習得: 上の検索ボックスに技名を入れると、実装済みの全技から候補が表示されます（選択中の追加技は表示され続けます）</div><div id="mvlist2">`;
  {
    const rec=new Set(d.mv.map(x=>x[0]));
    Object.keys(MOVES).filter(nm=>!rec.has(nm)).forEach(nm=>{
      const on=m.moves.includes(nm); const M=MOVES[nm];
      if(!on&&!S.qMove){ /* 検索前は非表示（filterで制御） */ }
      const info=M.cat==="X"?"変化":`${M.t} ${M.cat==="P"?"物理":"特殊"} 威力${M.p}`;
      html+=`<label data-n="${nm}" class="chk ${on?"on":""}" ${on?'style="display:inline-block;"':""}><input type="checkbox" ${on?"checked":""} onchange="toggleMove('${nm}')">${nm}<br><span class="note">${info}${M.acc?` 命中${M.acc}`:" 必中"}${rangeNote(M)}</span></label>`;
    });
  }
  html+=`</div><div class="note">選択中: ${m.moves.length}/4</div>`;
  html+=`<h3>持ち物（現在: ${esc(m.item)}${ITEMS[m.item]?"｜"+ITEMS[m.item].d:""}）</h3>使用率順: `;
  d.items.forEach(it=>{ html+=`<button class="${m.item===it[0]?"sel":""}" onclick="setItem('${it[0]}')">${it[0]}${it[1]!==null?` <span class="note">${it[1]}%</span>`:""}</button>`; });
  [d.mega,d.mega2].forEach(mg=>{
    if(mg&&!d.items.some(it=>it[0]===mg.stone))
      html+=`<button class="${m.item===mg.stone?"sel":""}" onclick="setItem('${mg.stone}')">${mg.stone} <span class="note">→${mg.n}</span></button>`;
  });
  html+=`<br>検索: <input type="text" id="itemsearch" placeholder="持ち物名（ひらがな可・検索すると候補表示）" oninput="S.qItem=this.value;filterEls(this,'itemlist',true)" style="width:180px;"><div id="itemlist">`;
  GENERAL_ITEMS.forEach(k=>{ html+=`<button data-n="${k}" class="${m.item===k?"sel":""}" onclick="setItem('${k}')">${k}<br><span class="note">${ITEMS[k].d}</span></button>`; });
  html+=`</div>`;
  html+=`<h3>性格補正（上昇1.1倍・下降0.9倍・小数点切り捨て）</h3>上げる: <select onchange="setNat('plus',this.value)">`+natOpts(m.plus)+`</select>　下げる: <select onchange="setNat('minus',this.value)">`+natOpts(m.minus)+`</select> <span class="note">HPは補正不可・同じ能力は不可</span>`;
  html+=`<h3>能力ポイント（残り <b style="color:${rest<0?"#d05050":"#4caf7d"}">${rest}</b> / 66、各32まで）</h3><table class="evt"><tr><th></th>`;
  STATKEYS.forEach(k=>html+=`<th>${STATN[k]}</th>`);

  html+=`</tr><tr><td>ポイント</td>`;
  STATKEYS.forEach(k=>{ html+=`<td><input type="number" min="0" max="32" value="${m.ev[k]||0}" onchange="setEv('${k}',this.value)"></td>`; });
  html+=`</tr><tr><td>実数値</td>`;

  if(d.mega2){ const stM2=calcStats(m.dex,m.ev,d.mega2,{plus:m.plus,minus:m.minus}); html+=`<tr><td>${d.mega2.n}後</td>`; STATKEYS.forEach(k=>html+=`<td class="note">${stM2[k]}</td>`); html+=`</tr>`; }
  html+=`</table></div>`;
  return html;
}
function rangeNote(M){
  if(M.cat==="X") return "";
  let n=[];
  if(M.rng==="SP")n.push("相手全体");
  if(M.rng==="ADJ")n.push("自分以外全体");
  if(M.t==="ひこう"||M.pul||M.lr)n.push("位置無視");
  return n.length?" ["+n.join("/")+"]":"";
}

window.setEv=function(k,v){
  const m=S.team.mons[S.srcIdx];
  v=Math.max(0,Math.min(32,parseInt(v)||0));
  m.ev[k]=v;
  if(evTotal(m.ev)>66){ m.ev[k]=Math.max(0, 66-(evTotal(m.ev)-m.ev[k]*1)); alert("合計66までです"); }
  render();
};
function natOpts(cur){
  let o=`<option value="none" ${!cur||cur==="none"?"selected":""}>なし</option>`;
  ["a","b","c","d","s"].forEach(k=>{ o+=`<option value="${k}" ${cur===k?"selected":""}>${STATN[k]}</option>`; });

}
window.setNat=function(which,v){

window.createCustomMove=function(){
  const g=id=>document.getElementById(id);
  const name=(g("cmname").value||"").trim();
  if(!name){alert("技名を入力してください");return;}
  if(MOVES[name]){alert("同名の技が既に存在します");return;}
  const cat=g("cmcat").value;
  const d={t:g("cmtype").value,cat,rng:g("cmrng").value};
  const pow=Math.max(0,Math.min(300,parseInt(g("cmpow").value)||0));
  const acc=Math.max(0,Math.min(100,parseInt(g("cmacc").value)||0));
  if(cat!=="X"){ d.p=pow; if(acc>0)d.acc=acc; else d.acc=0; if(g("cmc").checked)d.c=1; }
  else { d.acc=acc>0?acc:100; d.fx="customstatus"; d.rng="S"; }
  if(g("cmlr").checked)d.lr=1;
  if(g("cmsnd").checked)d.snd=1;
  const pr=Math.max(-7,Math.min(5,parseInt(g("cmprio").value)||0));
  if(pr)d.prio=pr;
  const ch=Math.max(0,Math.min(100,parseInt(g("cmch").value)||0));
  const eff=g("cmeff").value;
  const stg=g("cmstatTgt").value;
  if(ch>0&&(eff||stg)){
    d.sec={ch};
    if(eff==="fl")d.sec.fl=1; else if(eff)d.sec.st=eff;
    if(stg){
      const key=g("cmstatKey").value, amt=parseInt(g("cmstatAmt").value)||1;
      if(stg==="t"){ d.sec.stat={}; d.sec.stat[key]=amt; }
      else { d.sec.selfstat={}; d.sec.selfstat[key]=amt; }
    }
  }
  if(cat==="X"&&(!d.sec)){alert("変化技には追加効果（％と、状態異常か能力変化）を設定してください");return;}
  const cm=loadCustomMoves(); cm.push({n:name,d}); saveCustomMoves(cm);
  MOVES[name]=d;
  alert(name+"を追加しました。各ポケモンの「追加習得」検索から覚えさせられます。");
  render();
};

/* =============== バトルモン生成 =============== */
function mkBattleMon(cfg, side){
  const d=DEX[cfg.dex];
  const st=calcStats(cfg.dex,cfg.ev,false,{plus:cfg.plus,minus:cfg.minus});
  return {
    cfg, side, dex:cfg.dex, name:d.n, types:d.t.slice(), ability:cfg.ability, item:cfg.item, itemUsed:false,
    stats:st, hp:st.h, maxhp:st.h, status:null, slpTurns:0,
    boosts:{a:0,b:0,c:0,d:0,s:0}, isMega:false, fainted:false,
    vol:{}
  };
}
function megaEvolve(mon){
  const mg=megaFor(mon); if(!mg) return;
  const hpRatio=mon.hp;
  mon.isMega=true; mon.name=mg.n; mon.types=mg.t.slice(); mon.ability=mg.abil;
  const st=calcStats(mon.dex,mon.cfg.ev,mg,{plus:mon.cfg.plus,minus:mon.cfg.minus});
  mon.stats=st;
  mon.hp=hpRatio;
}
/* =============== バトル状態 =============== */
let B=null;
function startBattle(){
  const mk=(p)=>S.orders[p].map(mi=>mkBattleMon(S.teams[p].mons[mi],p));
  const t1=mk(1), t2=mk(2);
  B={
    turn:1, log:[`=== バトル開始！ ===`],
    sides:{
      1:{team:t1, field:[t1[0],t1[1],t1[2]], megaUsed:false, fx:{}},
      2:{team:t2, field:[t2[0],t2[1],t2[2]], megaUsed:false, fx:{}}
    },
    hideInfo:!!S.hideInfo,
    weather:null, weatherTurns:0, terrain:null, terrainTurns:0, trickroom:0,
    phase:"handoff", inputPlayer:1, pending:{}, winner:null, replaceQueue:[],
  };
  B.sides[1].field.forEach(m=>m.vol.firstTurn=true);
  B.sides[2].field.forEach(m=>m.vol.firstTurn=true);
  S={mode:"battle"};
  const entries=[...B.sides[1].field.map(m=>[1,m]),...B.sides[2].field.map(m=>[2,m])];
  entries.sort((x,y)=>effSpe(y[1])-effSpe(x[1]));
  entries.forEach(([sd,m])=>onEntry(m));
  render();
}
function log(s){ if(B&&B._collect){ B._collect.push(s); return; } B.log.push(s); }
function flushHitLogs(arr){ if(arr&&arr.length){ arr.forEach(s=>B.log.push(s)); arr.length=0; } }
function foeSide(s){ return s===1?2:1; }
function alive(mon){ return mon && !mon.fainted; }
function fieldPos(mon){ const f=B.sides[mon.side].field; return f.indexOf(mon); }
function reachable(myPos,foePos){ return Math.abs((2-myPos)-foePos)<=1; }
function ignoresReach(M){ return M.t==="ひこう"||M.pul||M.lr; }
function grounded(mon){ return !(mon.types.includes("ひこう")||effAbility(mon)==="ふゆう"||mon.item==="ふうせん"); }
function effAbility(mon){
  if(!mon)return null;
  if(typeof B==="undefined"||!B||!B.sides)return mon.ability;
  if(mon.ability==="かがくへんかガス")return mon.ability;
  if(mon.item==="とくせいガード")return mon.ability;
  const gas=[1,2].some(pp=>B.sides[pp].field.some(mm=>mm&&!mm.fainted&&mm!==mon&&mm.ability==="かがくへんかガス"));
  return gas?null:mon.ability;
}
function highestStat(mon){ let best="a"; for(const k of ["b","c","d","s"]) if(mon.stats[k]>mon.stats[best])best=k; return best; }
function isChoiceItem(it){ return it==="こだわりスカーフ"||it==="こだわりハチマキ"||it==="こだわりメガネ"; }
function isTrapped(mon,pos){
  if(mon.types.includes("ゴースト")||mon.item==="きれいなぬけがら")return false;
  return B.sides[foeSide(mon.side)].field.some((m,fp2)=>alive(m)&&effAbility(m)==="かげふみ"&&reachable(pos,fp2));
}
/* =============== 特性・場効果 =============== */
function onEntry(mon){
  const a=effAbility(mon);
  if(a==="ひでり"){ setWeather("sun",mon); }
  if(a==="あめふらし"){ setWeather("rain",mon); }
  if(a==="すなおこし"){ setWeather("sand",mon); }
  if(a==="ゆきふらし"){ setWeather("snow",mon); }
  if(a==="サイコメイカー"&&B.terrain!=="psy"){ B.terrain="psy"; B.terrainTurns=5; log(`${mon.name}のサイコメイカー！足下がふしぎな感じになった！`); }
  if(a==="グラスメイカー"&&B.terrain!=="grass"){ B.terrain="grass"; B.terrainTurns=5; log(`${mon.name}のグラスメイカー！足下に草がしげった！`); }
  if(a==="ミストメイカー"&&B.terrain!=="mist"){ B.terrain="mist"; B.terrainTurns=5; log(`${mon.name}のミストメイカー！足下に霧が立ちこめた！`); }
  if(a==="エレキメーカー"&&B.terrain!=="elec"){ B.terrain="elec"; B.terrainTurns=5; log(`${mon.name}のエレキメーカー！足下に電気が流れた！`); }
  checkSeeds();
  if(a==="いかく"){
    const fs=B.sides[foeSide(mon.side)].field; const p=fieldPos(mon);
    fs.forEach((f,fp)=>{ if(alive(f)&&reachable(p,fp)){
      if(effAbility(f)==="マイペース"){ log(`${f.name}はマイペースでいかくを受けない！`); return; }
      applyBoost(f,{a:-1},mon,`${mon.name}のいかく`); } });
  }
  if(a==="きけんよち"){
    const p=fieldPos(mon);
    const danger=[];
    B.sides[foeSide(mon.side)].field.forEach((f,fp)=>{
      if(!alive(f)||!reachable(p,fp))return;
      (f.cfg.moves||[]).forEach(n=>{ const M=MOVES[n]; if(!M||M.cat==="X")return;
        if(typeEff(f,M,moveTypeOf(f,n,M),mon)>1||(M.p||0)>=100) danger.push(f.name); });
    });
    if(danger.length) log(`${mon.name}のきけんよち！${[...new Set(danger)].join("・")}の攻撃に危険を感じている！`);
    else log(`${mon.name}のきけんよち！危険な技は感じられない。`);
  }
  if(a==="ダウンロード"){
    const fs=B.sides[foeSide(mon.side)].field.filter(alive);
    if(fs.length){ const sumB=fs.reduce((s,f)=>s+f.stats.b,0), sumD=fs.reduce((s,f)=>s+f.stats.d,0);
      applyBoost(mon, sumB<sumD?{a:1}:{c:1}, mon, `${mon.name}のダウンロード`); }
  }
  if(a==="おもてなし"){
    const allies=B.sides[mon.side].field.filter(m=>alive(m)&&m!==mon);
    allies.forEach(t=>{ t.hp=Math.min(t.maxhp,t.hp+Math.floor(t.maxhp/4)); });
    if(allies.length) log(`${mon.name}のおもてなし！味方のHPが回復した！`);
  }
  if(a==="トレース"){
    const foes=B.sides[foeSide(mon.side)].field.filter(alive);
    if(foes.length){
      const t=foes[Math.floor(Math.random()*foes.length)];
      if(t.ability&&effAbility(t)!=="トレース"){
        mon.ability=t.ability;
        log(`${mon.name}のトレース！${t.name}の${t.ability}をコピーした！`);
        onEntry(mon);
      }
    }
  }
  if(a==="しれいとう"||mon.name==="ヘイラッシャ"){ tryCommander(mon.side); }
  if(a==="きょうえん"){
    const f=B.sides[mon.side].field; const pos=fieldPos(mon);
    const allies=f.filter(m=>alive(m)&&m!==mon);
    let src=null;
    if(pos!==1){ if(alive(f[1])&&f[1]!==mon)src=f[1]; }
    else if(allies.length){
      const sum=x=>["a","b","c","d","s"].reduce((s,k)=>s+Math.max(0,x.boosts[k]),0);
      allies.sort((x,y)=>sum(y)-sum(x));
      src = (allies.length>1&&sum(allies[0])===sum(allies[1])) ? allies[Math.floor(Math.random()*allies.length)] : allies[0];
    }
    if(src&&["a","b","c","d","s"].some(k=>src.boosts[k]!==0)){
      mon.boosts={...src.boosts};
      log(`${mon.name}のきょうえん！${src.name}の能力変化をコピーした！`);
    }
  }
}
function checkSeeds(){
  const map={"エレキシード":["elec","b"],"グラスシード":["grass","b"],"ミストシード":["mist","d"],"サイコシード":["psy","d"]};
  for(const pp of [1,2]) for(const m of B.sides[pp].field){
    if(!alive(m))continue;
    const sd=map[m.item];
    if(sd&&B.terrain===sd[0]&&!m.itemUsed){
      const nm=m.item; consumeItem(m);
      const dd={}; dd[sd[1]]=1;
      applyBoost(m,dd,m,`${m.name}は${nm}を使った`);
    }
  }
}
function gasGone(entering){
  const active=[1,2].some(pp=>B.sides[pp].field.some(m=>alive(m)&&m.ability==="かがくへんかガス"));
  if(active){ if(entering)onEntry(entering); return; }
  log("かがくへんかガスが消え去った！みんなの特性が発動した！");
  const all=[];
  for(const pp of [1,2]) for(const m of B.sides[pp].field) if(alive(m)) all.push(m);
  all.sort((x,y)=>effSpe(y)-effSpe(x));
  all.forEach(m=>onEntry(m));
}
function tryCommander(side){
  const f=B.sides[side].field;
  const tatsu=f.find(m=>alive(m)&&m.name==="シャリタツ"&&effAbility(m)==="しれいとう"&&!m.vol.commander);
  const don=f.find(m=>alive(m)&&m.name==="ヘイラッシャ"&&!m.vol.commanded);
  if(tatsu&&don){
    tatsu.vol.commander=true; don.vol.commanded=true;
    log(`${tatsu.name}のしれいとう！${don.name}の口の中に入って指令を出し始めた！`);
    applyBoost(don,{a:2,b:2,c:2,d:2,s:2},don,``);
    log(`${tatsu.name}には技が当たらない！（行動不可・${don.name}は交代不可）`);
  }
}
function setWeather(w,mon){
  if(B.weather===w) return;
  B.weather=w;
  let turns=5;
  if(mon&&mon.item==="しめったいわ"&&w==="rain")turns=8;
  if(mon&&mon.item==="あついいわ"&&w==="sun")turns=8;
  B.weatherTurns=turns;
  log(w==="sun"?"日ざしが強くなった！":w==="rain"?"雨が降り始めた！":w==="snow"?"雪が降り始めた！":"砂あらしが吹き始めた！");
}
function applyBoost(mon,delta,src,label){
  const isSelf = src===mon;
  let d={...delta};
  if(effAbility(mon)==="あまのじゃく"){ for(const k in d) d[k]=-d[k]; }
  const lowering = Object.values(d).some(v=>v<0);
  if(!isSelf && lowering){
    if(effAbility(mon)==="クリアボディ"||effAbility(mon)==="しろいけむり"){ log(`${mon.name}は${mon.ability}で能力が下がらない！`); return; }
    if(mon.item==="クリアチャーム"){ log(`${mon.name}はクリアチャームで能力が下がらない！`); return; }
    const allies=B.sides[mon.side].field;
    if(mon.types.includes("くさ") && allies.some(m=>alive(m)&&effAbility(m)==="フラワーベール")){ log(`フラワーベールで${mon.name}の能力は下がらない！`); return; }
  }
  let changed=[];
  for(const k in d){
    if(!d[k])continue;
    const old=mon.boosts[k];
    mon.boosts[k]=Math.max(-6,Math.min(6,old+d[k]));
    if(mon.boosts[k]!==old) changed.push(`${STATN[k]}が${mon.boosts[k]>old?"上がった":"下がった"}`);
  }
  if(changed.length){ log(`${label?label+"！ ":""}${mon.name}の${changed.join("、")}！`);
    if(!isSelf && lowering && effAbility(mon)==="まけんき"){ mon.boosts.a=Math.min(6,mon.boosts.a+2); log(`${mon.name}のまけんき！攻撃がぐーんと上がった！`); }
    if(Object.values(mon.boosts).some(v=>v<0) && mon.item==="しろいハーブ" && !mon.itemUsed){
      for(const k in mon.boosts) if(mon.boosts[k]<0) mon.boosts[k]=0;
      consumeItem(mon); log(`${mon.name}はしろいハーブで能力ダウンを回復した！`);
    }
  }
}
function consumeItem(mon){
  mon.item="なし"; mon.itemUsed=true;
  if(effAbility(mon)==="かるわざ"&&!mon.vol.unburden){ mon.vol.unburden=true; log(`　${mon.name}のかるわざ！持ち物がなくなって素早さが2倍になった！`); }
  symbiosisGive(mon);
}
function symbiosisGive(receiver){
  if(!receiver||receiver.item!=="なし")return;
  const f=B.sides[receiver.side].field;
  const giver=f.find(m=>alive(m)&&m!==receiver&&effAbility(m)==="きょうせい"&&m.item!=="なし"&&!ITEMS[m.item].stone);
  if(!giver)return;
  receiver.item=giver.item; receiver.itemUsed=false;
  log(`　${giver.name}のきょうせい！${receiver.name}に${receiver.item}を渡した！`);
  giver.item="なし";
  if(effAbility(giver)==="かるわざ"&&!giver.vol.unburden){ giver.vol.unburden=true; log(`　${giver.name}のかるわざ！素早さが2倍になった！`); }
  if(receiver.vol.unburden){ receiver.vol.unburden=false; }
  checkSeeds();
}
function loseItem(mon){
  mon.item="なし";
  if(effAbility(mon)==="かるわざ"&&!mon.vol.unburden){ mon.vol.unburden=true; log(`　${mon.name}のかるわざ！持ち物がなくなって素早さが2倍になった！`); }
}
function effSpe(mon){
  let s=mon.stats.s*boostMul(mon.boosts.s);
  if(mon.status==="par")s*=0.5;
  if(mon.item==="こだわりスカーフ")s*=1.5;
  if(effAbility(mon)==="すいすい"&&B.weather==="rain")s*=2;
  if(effAbility(mon)==="ようりょくそ"&&B.weather==="sun")s*=2;
  if(effAbility(mon)==="すなかき"&&B.weather==="sand")s*=2;
  if(effAbility(mon)==="こだいかっせい"&&B.weather==="sun"&&highestStat(mon)==="s")s*=1.5;
  if(mon.vol.unburden)s*=2;
  if(B.sides[mon.side].fx.tailwind)s*=2;
  return s;
}

function calcState(){
  if(!B.calc)B.calc={};
  const c=B.calc, p=B.showCalc;
  const field=B.sides[p].field.map((m,i)=>({m,i})).filter(x=>alive(x.m)&&!x.m.vol.commander);
  if(!field.length)return null;
  if(c.side!==p||!field.some(x=>x.i===c.pos)){ c.side=p; c.pos=field[0].i; c.move=null; c.myRank=undefined; }
  const att=B.sides[p].field[c.pos];
  const moves=(att.cfg.moves||[]).filter(n=>MOVES[n]&&MOVES[n].cat!=="X");
  if(!moves.includes(c.move))c.move=moves[0]||null;
  if(c.hpEv===undefined)c.hpEv=0;
  if(c.defEv===undefined)c.defEv=0;
  if(c.nat===undefined)c.nat=1;
  if(c.foeRank===undefined)c.foeRank="board";
  const M=c.move?MOVES[c.move]:null;
  const key=(M&&M.cat==="P")?"a":"c";
  if(c.myRank===undefined||c.myKey!==key){ c.myKey=key; c.myRank=att.boosts[key]||0; }
  return {p:p,att:att,moves:moves,field:field};
}
/* 相手の仮の個体をつくる。特性と持ち物は無視する */
function calcFoeMon(src,c,defPhys){
  const d=DEX[src.dex];
  const ev={h:c.hpEv,b:c.defEv,d:c.defEv};
  const st=calcStats(src.dex,ev,(src.isMega&&d.mega)?d.mega:false,null);
  const k=defPhys?"b":"d";
  if(c.nat!==1)st[k]=Math.floor(st[k]*c.nat);
  const rank=(c.foeRank==="board")?(src.boosts?(src.boosts[k]||0):0):c.foeRank;
  const bo={a:0,b:0,c:0,d:0,s:0}; bo[k]=rank;
  return {
    srcRef:src, side:src.side, dex:src.dex, name:src.name, types:src.types.slice(),
    ability:"", item:"なし", itemUsed:true, stats:st, hp:st.h, maxhp:st.h,
    status:null, boosts:bo, isMega:!!src.isMega, fainted:false, vol:{}, cfg:src.cfg
  };
}
/* 乱数の下限・上限と、HP以上になる確率 */
function rollStats(raw,hp){
  const at=r=>Math.max(1,Math.floor(raw*(0.85+r*0.15)));
  const lo=at(0), hi=at(1);
  const pKO=n=>{
    if(n<=0)return 0;
    if(n===1){
      const r=(hp/raw-0.85)/0.15;
      if(r<=0)return 1;
      if(r>1)return 0;
      return 1-r;
    }
    let hit=0;
    for(let i=0;i<4000;i++){ let s2=0; for(let k=0;k<n;k++)s2+=at(Math.random()); if(s2>=hp)hit++; }
    return hit/4000;
  };
  const need=Math.max(1,Math.ceil(hp/hi));
  const worst=Math.max(1,Math.ceil(hp/lo));
  return {lo:lo,hi:hi,need:need,worst:worst,pKO:pKO};
}
function calcRows(){
  const cs=calcState();
  if(!cs)return `<div class="note">${TX("calc_noatt")}</div>`;
  const c=B.calc, p=cs.p, att=cs.att;
  if(!c.move)return `<div class="note">${TX("calc_none")}</div>`;
  const M=MOVES[c.move];
  const fp=foeSide(p);
  const foesOnField=B.sides[fp].field.filter(m=>alive(m)&&!m.vol.commander).length;
  const spread=(M.rng==="SP"||M.rng==="ADJ")&&foesOnField>=2;
  const defPhys=(M.fx==="psyshock")?true:(M.cat==="P");
  const key=c.myKey, keep=att.boosts[key];
  att.boosts[key]=c.myRank;
  let rows="";
  B.sides[fp].team.forEach(src=>{
    const onField=B.sides[fp].field.includes(src);
    const foe=calcFoeMon(src,c,defPhys);
    const r=calcDamage(att,foe,c.move,M,{spread:spread,roll:0,forceCrit:false});
    const rc=calcDamage(att,foe,c.move,M,{spread:spread,roll:1,forceCrit:true});
    if(!r.raw||r.eff===0){
      rows+=`<tr class="${src.fainted?"faint":""}"><td class="nmcell">${esc(src.name)}</td><td colspan="4" class="note">${TX("calc_immune")}</td></tr>`;
      return;
    }
    const useNow=onField&&!src.fainted;
    const hp=useNow?src.hp:foe.maxhp;
    const hpLabel=useNow?TX("calc_hp_now"):TX("calc_hp_full");
    const st=rollStats(r.raw,hp);
    const pct=v=>(v/foe.maxhp*100).toFixed(1);
    let verdict;
    if(st.need===st.worst) verdict=TX("calc_fix",st.need);
    else { const pc=Math.round(st.pKO(st.need)*100); verdict=(st.need===1)?TX("calc_ko1",pc):TX("calc_rand",st.need,pc); }
    rows+=`<tr class="${src.fainted?"faint":""}">
      <td class="nmcell">${esc(src.name)}${onField?`<span class="st mega">${TX("onfield")}</span>`:""}${src.fainted?" ✕":""}</td>
      <td>${st.lo}〜${st.hi}</td>
      <td>${pct(st.lo)}〜${pct(st.hi)}%</td>
      <td class="note">${TX("calc_crit")} ${rc.dmg}</td>
      <td>${verdict}<span class="note"> / ${hpLabel} ${hp}</span></td></tr>`;
  });
  att.boosts[key]=keep;
  return `<div class="note">${spread?TX("calc_spread"):""}</div>
    <div class="tblwrap"><table class="stats">${rows}</table></div>`;
}

  left+=`<div class="note">${TX("calc_note")}</div></div>`;
  return `<div class="overlay"><div class="statsbox calcbox">

  </div></div>`;

function boardHtml(activeSide,activePos,viewer){
  const hideFor=s=>B.hideInfo&&viewer&&s!==viewer;

  const cond=[];
  if(B.weather)cond.push(`${{sun:"晴れ",rain:"あめ",sand:"砂あらし",snow:"ゆき"}[B.weather]}(残${B.weatherTurns})`);
  if(B.terrain==="psy")cond.push(`サイコフィールド(残${B.terrainTurns})`);
  if(B.terrain==="grass")cond.push(`グラスフィールド(残${B.terrainTurns})`);
  if(B.terrain==="mist")cond.push(`ミストフィールド(残${B.terrainTurns})`);
  if(B.terrain==="elec")cond.push(`エレキフィールド(残${B.terrainTurns})`);
  if([1,2].some(pp=>B.sides[pp].field.some(m=>alive(m)&&m.ability==="かがくへんかガス")))cond.push("かがくへんかガス（特性無効）");
  if(B.trickroom)cond.push(`トリックルーム(残${B.trickroom})`);
  [1,2].forEach(p=>{
    const fx=B.sides[p].fx; const t=[];
    const mask=B.hideInfo&&viewer&&p!==viewer;
    const rem=(v,clay)=>{ if(mask&&clay){ const r=v-3; return r>0?r:"?"; } return v; };
    if(fx.reflect)t.push(`リフレクター(残${rem(fx.reflect,fx.reflectClay)})`);
    if(fx.light)t.push(`ひかりのかべ(残${rem(fx.light,fx.lightClay)})`);
    if(fx.tailwind)t.push(`おいかぜ(残${fx.tailwind})`);
    if(fx.safeguard)t.push(`しんぴのまもり(残${fx.safeguard})`);
    if(t.length)cond.push(`P${p}:${t.join("/")}`);
  });
  const who=viewer||B.inputPlayer||1;
  const statsBtn=`<button class="statsbtn" onclick="B.showStats=${who};render()">${TX("stats_btn")}</button>`;
  const calcBtn=`<button class="statsbtn" onclick="B.showCalc=${who};render()">${TX("calc_btn")}</button>`;

   <div class="hdrow">${calcBtn}<span class="note benchline">${TX("player",2)}　${TX("bench")}:${benchList(2,hideFor(2))}</span>${statsBtn}</div><div class="row">`;
  [2,1,0].forEach(p=>{ html+=slotHtml(f2[p],TX("pos_of",2,p),activeSide===2&&activePos===p,hideFor(2)); });
  html+=`</div><div class="row">`;
  [0,1,2].forEach(p=>{ html+=slotHtml(f1[p],TX("pos_of",1,p),activeSide===1&&activePos===p,hideFor(1)); });
  html+=`</div><div class="note" style="text-align:center;">${TX("player",1)}　${TX("bench")}:${benchList(1,hideFor(1))}</div></div>`;
  return html;
}

function legalTargets(mon,pos,M){

    B.sides[pl].field.forEach((m,p2)=>{ if(alive(m)&&m!==mon&&!m.vol.commander&&(!M.adj||Math.abs(p2-pos)===1))res.push([pl,p2]); });
  } else if(M.rng==="S"){
    B.sides[fp].field.forEach((m,p2)=>{ if(alive(m)&&!m.vol.commander&&(ignoresReach(M)||reachable(pos,p2)))res.push([fp,p2]); });
    B.sides[pl].field.forEach((m,p2)=>{ if(alive(m)&&m!==mon&&!m.vol.commander&&(ignoresReach(M)||Math.abs(p2-pos)===1))res.push([pl,p2]); });

/* =============== ダメージ計算 =============== */
function typeEff(att,M,mType,def){
  if(M&&M.fx==="struggle")return 1;
  let e=1;
  for(const t of def.types){
    let m=(CHART[mType]&&CHART[mType][t]!==undefined)?CHART[mType][t]:1;
    if(M&&M.fx==="freezedry"&&t==="みず")m=2;
    if(m===0){
      if(t==="ゴースト"&&(mType==="ノーマル"||mType==="かくとう")&&(effAbility(att)==="きもったま"||effAbility(att)==="しんがん"))m=1;
    }
    e*=m;
  }
  return e;
}
function moveTypeOf(att,name,M){
  let mt=M.t;
  if(M.fx==="weatherball"){ mt = B.weather==="sun"?"ほのお":B.weather==="rain"?"みず":B.weather==="sand"?"いわ":B.weather==="snow"?"こおり":"ノーマル"; }
  if(effAbility(att)==="フェアリースキン"&&mt==="ノーマル") mt="フェアリー";
  if(effAbility(att)==="スカイスキン"&&mt==="ノーマル") mt="ひこう";
  return mt;
}
function movePowerOf(att,name,M,def){
  let p=M.p;
  if(M.fx==="weatherball"&&B.weather)p=100;
  if(M.fx==="hpscale")p=Math.max(1,Math.floor(150*att.hp/att.maxhp));
  if(M.fx==="lastrespects"){ const f=B.sides[att.side].team.filter(m=>m.fainted).length; p=50+50*Math.min(f,5); }
  if(M.fx==="facade"&&att.status)p=140;
  if(M.fx==="storedpower"){ p=20+20*STATKEYS.slice(1).reduce((s,k)=>s+Math.max(0,att.boosts[k]),0); }
  if(M.fx==="expandingforce"&&B.terrain==="psy")p=Math.floor(p*1.5);
  if(M.fx==="knockoff"&&def&&def.item!=="なし"&&!ITEMS[def.item].stone)p=Math.floor(p*1.5);
  if(effAbility(att)==="フェアリースキン"&&M.t==="ノーマル")p=Math.floor(p*1.2);
  if(effAbility(att)==="スカイスキン"&&M.t==="ノーマル")p=Math.floor(p*1.2);
  if(effAbility(att)==="すてみ"&&M.recoil)p=Math.floor(p*1.2);
  if(M.fx==="acrobatics"&&att.item==="なし")p*=2;
  if(M.fx==="ragefist")p=Math.min(350,50+50*(att.rageHits||0));
  if(M.fx==="fishious"&&def&&!def.vol.movedThisTurn)p*=2;
  if(M.fx==="risingvolt"&&B.terrain==="elec"&&def&&grounded(def))p*=2;
  if(B.terrain==="grass"&&name==="じしん"&&def&&grounded(def))p=Math.floor(p/2);
  if(effAbility(att)==="テクニシャン"&&p<=60)p=Math.floor(p*1.5);
  return p;
}
function calcDamage(att,def,name,M,opts){
  opts=opts||{};
  const mt=moveTypeOf(att,name,M);
  if(mt==="じめん"&&!grounded(def)&&effAbility(att)!=="かたやぶり") return {dmg:0,eff:0,imm:`当たらない`};
  const eff=typeEff(att,M,mt,def);
  if(eff===0) return {dmg:0,eff:0};
  if(effAbility(def)==="ふしぎなまもり"&&eff<=1) return {dmg:0,eff:0,imm:"ふしぎなまもりで効かない"};
  const p=movePowerOf(att,name,M,def);
  if(p<=0) return {dmg:0,eff:1};
  const phys = M.fx==="psyshock" ? false : M.cat==="P";
  const defPhys = M.fx==="psyshock" ? true : M.cat==="P";
  let crit=false;
  { const critChance=M.crit===2?1:(M.crit?1/8:1/24);
    if(opts.forceCrit!==undefined) crit=!!opts.forceCrit;                       // ダメージ計算画面用
    else if(effAbility(def)!=="シェルアーマー"&&Math.random()<critChance)crit=true; }
  const igAtk = effAbility(def)==="てんねん";
  const igDef = effAbility(att)==="てんねん"||M.fx==="sacredsword";

  if(M.fx==="foulplay") A=def.stats.a*aBoost(def.boosts.a);
  else if(M.fx==="bodypress") A=att.stats.b*aBoost(att.boosts.b);
  else A = M.cat==="P" ? att.stats.a*aBoost(att.boosts.a) : att.stats.c*aBoost(att.boosts.c);
  let D = defPhys ? def.stats.b*dBoost(def.boosts.b) : def.stats.d*dBoost(def.boosts.d);
  // わざわい系（本人以外すべてに影響）
  {
    // srcRef はダメージ計算画面が作る仮の個体が、元の自分自身を「他人」と数えないための目印
    const ruin=(nm,self)=>[1,2].some(pp=>B.sides[pp].field.some(m=>alive(m)&&m!==self&&m!==(self&&self.srcRef)&&effAbility(m)===nm));
    if(defPhys && ruin("わざわいのつるぎ",def)) D*=0.75;      // 防御ダウン
    if(!defPhys && ruin("わざわいのたま",def)) D*=0.75;        // 特防ダウン（イーユイ）
    if(M.cat==="S" && ruin("わざわいのうつわ",att)) A*=0.75;   // 特攻ダウン（ディンルー）

  }

    const hsA=highestStat(att), hsD=highestStat(def);
    if(effAbility(att)==="こだいかっせい"&&((M.cat==="P"&&hsA==="a")||(M.cat==="S"&&hsA==="c")))A*=1.3;
    if(effAbility(def)==="こだいかっせい"&&((defPhys&&hsD==="b")||(!defPhys&&hsD==="d")))D*=1.3;
  }
  if(B.terrain==="elec"){
    const hsA=highestStat(att), hsD=highestStat(def);
    if(effAbility(att)==="クォークチャージ"&&((M.cat==="P"&&hsA==="a")||(M.cat==="S"&&hsA==="c")))A*=1.3;
    if(effAbility(def)==="クォークチャージ"&&((defPhys&&hsD==="b")||(!defPhys&&hsD==="d")))D*=1.3;
  }
  if(!defPhys && B.weather==="sand"&&def.types.includes("いわ"))D*=1.5;
  if(defPhys && B.weather==="snow"&&def.types.includes("こおり"))D*=1.5;
  if(def.item==="しんかのきせき")D*=1.5;
  if(!defPhys && def.item==="とつげきチョッキ")D*=1.5;
  if(B.weather==="sun"){
    if(M.cat==="P"&&M.fx!=="foulplay"&&M.fx!=="bodypress"&&B.sides[att.side].field.some(m=>alive(m)&&effAbility(m)==="フラワーギフト"))A*=1.5;
    if(!defPhys&&B.sides[def.side].field.some(m=>alive(m)&&effAbility(m)==="フラワーギフト"))D*=1.5;
  }
  let dmg=(22*p*(A/D))/50+2;
  let mod=1;
  if(opts.spread)mod*=0.75;
  if(B.weather==="sun"){ if(mt==="ほのお")mod*=1.5; if(mt==="みず")mod*=0.5; }
  if(B.weather==="rain"){ if(mt==="みず")mod*=1.5; if(mt==="ほのお")mod*=0.5; }
  if(B.terrain==="psy"&&mt==="エスパー"&&grounded(att))mod*=1.3;
  if(B.terrain==="grass"&&mt==="くさ"&&grounded(att))mod*=1.3;
  if(B.terrain==="mist"&&mt==="ドラゴン"&&grounded(def))mod*=0.5;
  if(B.terrain==="elec"&&mt==="でんき"&&grounded(att))mod*=1.3;
  if(crit)mod*=1.5;
  const dfx=B.sides[def.side].fx;
  if(!crit&&effAbility(att)!=="すりぬけ"){
    if(defPhys&&dfx.reflect)mod*=0.5;
    if(!defPhys&&dfx.light)mod*=0.5;
  }
  if(att.types.includes(mt))mod*=(effAbility(att)==="てきおうりょく")?2:1.5;
  mod*=eff;
  if(phys&&att.status==="brn"&&effAbility(att)!=="こんじょう")mod*=0.5;
  if(effAbility(att)==="かたいツメ"&&M.c)mod*=1.3;
  if(effAbility(att)==="メガランチャー"&&M.pul)mod*=1.5;
  if(effAbility(att)==="フェアリーオーラ"&&mt==="フェアリー")mod*=1.33;
  if(effAbility(att)==="トランジスタ"&&mt==="でんき")mod*=1.3;
  if(effAbility(att)==="すなのちから"&&B.weather==="sand"&&["いわ","じめん","はがね"].includes(mt))mod*=1.3;
  if(effAbility(att)==="ちからずく"&&M.sec)mod*=1.3;
  if(effAbility(att)==="がんじょうあご"&&["こおりのキバ","かみなりのキバ","ほのおのキバ","えらがみ","サイコファング","かみくだく"].includes(name))mod*=1.5;
  if(att.vol.flashfire&&mt==="ほのお")mod*=1.5;
  if(B.sides[def.side].field.some(m=>alive(m)&&m!==def&&effAbility(m)==="フレンドガード"))mod*=0.75;
  if(effAbility(att)==="こんじょう"&&att.status&&phys)mod*=1.5;
  if(effAbility(att)==="サンパワー"&&B.weather==="sun"&&M.cat==="S")mod*=1.5;
  if((effAbility(att)==="もうか"&&mt==="ほのお"||effAbility(att)==="げきりゅう"&&mt==="みず"||effAbility(att)==="しんりょく"&&mt==="くさ")&&att.hp<=att.maxhp/3)mod*=1.5;
  if(effAbility(att)==="そうだいしょう"){ const f=B.sides[att.side].team.filter(m=>m.fainted).length; mod*=(1+0.1*f); }

  if(att.item==="こだわりハチマキ"&&M.cat==="P")mod*=1.5;

  const typeBoost={"くろいメガネ":"あく","もくたん":"ほのお","しんぴのしずく":"みず","ようせいのハネ":"フェアリー","メタルコート":"はがね","のろいのおふだ":"ゴースト","するどいくちばし":"ひこう","まがったスプーン":"エスパー","とけないこおり":"こおり","シルクのスカーフ":"ノーマル","りゅうのキバ":"ドラゴン"};

/* =============== ターン解決 =============== */
function resolveTurn(){
  log(`--- ターン${B.turn} ---`);
  const acts=[];
  for(const p of [1,2]){
    const pen=B.pending[p];
    for(const k in pen.acts){
      const a=pen.acts[k]; const mon=B.sides[p].field[a.pos];
      if(alive(mon)) acts.push({side:p,mon,a});
    }
  }
  const switches=acts.filter(x=>x.a.kind==="switch").sort((x,y)=>effSpe(y.mon)-effSpe(x.mon));
  for(const sw of switches){ doSwitch(sw.mon, sw.a.benchName); }
  for(const p of [1,2]){
    const mp=B.pending[p].mega;
    if(mp!==null&&mp!==undefined){

function actPrio(x){

    const M=MOVES[x.a.move]; prio=M.prio||0;
    if(effAbility(x.mon)==="いたずらごころ"&&M.cat==="X")prio+=1;
    if(effAbility(x.mon)==="はやてのつばさ"&&x.mon.hp===x.mon.maxhp&&M.t==="ひこう")prio+=1;

function continueResolution(){
  const E=B.exec;
  for(;;){
    E.remaining=E.remaining.filter(x=>alive(x.mon)&&fieldPos(x.mon)>=0);
    if(E.remaining.length===0)break;
    let best=E.remaining.find(x=>x.forceFirst)||null, bestSpd=0, bestPrio=0;
    if(!best)for(const x of E.remaining){
      let pr=actPrio(x);
      if(x.mon.item==="イバンのみ"&&!x.mon.itemUsed&&x.mon.hp<=x.mon.maxhp/4&&x.a.kind==="move")pr+=0.5;
      const spd=(B.trickroom? -effSpe(x.mon) : effSpe(x.mon))+Math.random()*0.01;
      if(!best||pr>bestPrio||(pr===bestPrio&&spd>bestSpd)){ best=x; bestSpd=spd; bestPrio=pr; }
    }
    best.forceFirst=false;
    E.remaining.splice(E.remaining.indexOf(best),1);
    execAction(best, E.movedSet, E.remaining);
    E.movedSet.add(best.mon);
    best.mon.vol.movedThisTurn=true;

    if(B.midSwitch){ B.phase="midswitch"; render(); return; }
  }
  endOfTurn();
  if(checkWin())return;
  B.replaceQueue=[];
  for(const p of [1,2]){
    B.sides[p].field=B.sides[p].field.map(m=>(m&&m.fainted)?null:m);
    B.sides[p].field.forEach((m,pos)=>{
      if(m===null&&benchMons(p).length>0)B.replaceQueue.push({p,pos});
    });

  if(B.replaceQueue.length){ B.phase="replace"; render(); return; }

}
function autoCenter(){
  const f1=B.sides[1].field, f2=B.sides[2].field;
  const a1=[0,1,2].filter(i=>alive(f1[i])&&!f1[i].vol.commander), a2=[0,1,2].filter(i=>alive(f2[i])&&!f2[i].vol.commander);
  if(a1.length===0||a2.length===0)return;
  let reach=false;
  for(const i of a1)for(const j of a2){ if(Math.abs(2-i-j)<=1)reach=true; }
  if(reach)return;
  [1,2].forEach(p=>{
    const f=B.sides[p].field;
    const idx=f.findIndex(m=>alive(m)&&!m.vol.commander);
    if(idx>=0&&idx!==1){ const tmp=f[1]; f[1]=f[idx]; f[idx]=tmp||null; f[1].vol.firstTurn=true; f[1].vol.justEntered=true; if(f[idx])f[idx].vol.firstTurn=true; }

function doSwitch(mon, benchName){
  const p=mon.side;
  if(mon.vol.commanded||mon.vol.commander){ log(`${mon.name}は合体していて交代できない！`); return; }
  const bench=benchMons(p).find(m=>m.name===benchName);
  const pos=fieldPos(mon);
  if(!bench||pos<0)return;
  if(effAbility(mon)==="さいせいりょく"&&mon.hp>0){ mon.hp=Math.min(mon.maxhp,mon.hp+Math.floor(mon.maxhp/3)); }
  mon.boosts={a:0,b:0,c:0,d:0,s:0}; mon.vol={};
  B.sides[p].field[pos]=bench;
  bench.vol.firstTurn=true; bench.vol.justEntered=true;
  log(`P${p}は${mon.name}を引っ込めて${bench.name}を繰り出した！`);
  if(mon.ability==="かがくへんかガス"){ gasGone(bench); } else { onEntry(bench); }
}
function protectedCheck(att,def,M,isSpread){
  const dfx=B.sides[def.side].fx;

    return "protect";
  }
  if(isSpread&&dfx.wide)return "wide";
  let eprio=(M.prio||0);
  if(M.fx==="grassyglide"&&B.terrain==="grass")eprio+=1;
  if(effAbility(att)==="はやてのつばさ"&&att.hp===att.maxhp&&M.t==="ひこう")eprio+=1;
  if(eprio>0&&M.cat!=="X"&&dfx.fast)return "fast";
  if(eprio>0&&att.side!==def.side&&B.sides[def.side].field.some(m=>alive(m)&&effAbility(m)==="テイルアーマー"))return "armortail";

}
function applyStatus(mon,st,src){
  if(mon.status||!alive(mon))return;
  if(st==="brn"&&mon.types.includes("ほのお"))return;
  if((st==="psn"||st==="tox")&&(mon.types.includes("どく")||mon.types.includes("はがね")))return;
  if(st==="par"&&mon.types.includes("でんき"))return;
  if(st==="frz"&&mon.types.includes("こおり"))return;
  if(st==="slp"&&effAbility(mon)==="やるき")return;
  if(src&&src!==mon&&mon.types.includes("くさ")&&B.sides[mon.side].field.some(m=>alive(m)&&effAbility(m)==="フラワーベール"))return;
  if(src&&src!==mon&&src.side!==mon.side&&B.sides[mon.side].fx.safeguard){ log(`　${mon.name}はしんぴのまもりに守られている！`); return; }
  if(B.terrain==="mist"&&grounded(mon)){ log(`　${mon.name}はミストフィールドに守られて状態異常にならない！`); return; }
  if(st==="slp"&&B.terrain==="elec"&&grounded(mon)){ log(`　${mon.name}はエレキフィールドで眠らない！`); return; }
  mon.status=st;
  if(st==="slp")mon.slpTurns=Math.random()<1/3?1:2;
  log(`　${mon.name}は${{brn:"やけどを負った",psn:"どくにおかされた",tox:"もうどくにおかされた",par:"まひして技が出にくくなった",slp:"眠ってしまった",frz:"凍りついた"}[st]}！`);
  if(mon.item==="ラムのみ"&&!mon.itemUsed){ mon.status=null; consumeItem(mon); log(`　${mon.name}はラムのみで状態異常を治した！`); }
}
function damage(mon,amt,label,ctx){
  if(!alive(mon))return 0;
  const outer=B._collect;
  const col=[]; B._collect=col;
  amt=Math.min(mon.hp,Math.max(1,Math.floor(amt)));
  if(amt>=mon.hp){
    if(effAbility(mon)==="がんじょう"&&mon.hp===mon.maxhp){ amt=mon.hp-1; log(`　${mon.name}はがんじょうで持ちこたえた！`); }
    else if(mon.item==="きあいのタスキ"&&mon.hp===mon.maxhp&&!mon.itemUsed){ amt=mon.hp-1; consumeItem(mon); log(`　${mon.name}はきあいのタスキで持ちこたえた！`); }
  }
  const wasAbove=mon.hp>mon.maxhp/2;
  mon.hp-=amt;
  if(label)B.log.push(`　${label}！（${amt}ダメージ）`);
  if(wasAbove&&mon.hp>0&&mon.hp<=mon.maxhp/2&&effAbility(mon)==="ぎゃくじょう"){ applyBoost(mon,{c:1},mon,`${mon.name}のぎゃくじょう`); }
  if(mon.hp<=0){ if(!(ctx&&ctx.noFaint))faint(mon); }
  else if(mon.hp<=mon.maxhp/2&&mon.item==="オボンのみ"&&!mon.itemUsed){
    const blocked=B.sides[foeSide(mon.side)].field.some(m=>alive(m)&&effAbility(m)==="きんちょうかん");
    if(!blocked){ const h=Math.floor(mon.maxhp/4); mon.hp=Math.min(mon.maxhp,mon.hp+h); consumeItem(mon); log(`　${mon.name}はオボンのみでHPを回復した！`); }
  }
  B._collect=outer;
  if(label||!(ctx&&ctx.hold)){ col.forEach(s=>{ if(outer)outer.push(s); else B.log.push(s); }); }
  else if(ctx&&ctx.hold){ ctx.hold.push(...col); }
  return amt;
}
function faint(mon){
  mon.fainted=true; mon.hp=0;
  log(`　${mon.name}はたおれた！`);
  if(mon.vol.commanded){ const t=B.sides[mon.side].field.find(m=>alive(m)&&m.vol.commander); if(t){ t.vol.commander=false; log(`　${t.name}は口の中から出てきた！`); } }
  if(mon.vol.commander){ const d2=B.sides[mon.side].field.find(m=>alive(m)&&m.vol.commanded); if(d2){ d2.vol.commanded=false; } }
  if(mon.ability==="かがくへんかガス"){ gasGone(null); }
  const pos=fieldPos(mon);
  if(pos>=0)B.sides[mon.side].field[pos]=null;
}
function endOfTurn(){
  if(B.weather){
    B.weatherTurns--;
    if(B.weatherTurns<=0){ log({sun:"日ざしが元に戻った",rain:"雨が上がった",sand:"砂あらしがおさまった",snow:"雪がやんだ"}[B.weather]); B.weather=null; }
    else if(B.weather==="sand"){
      for(const p of [1,2])for(const m of B.sides[p].field){
        if(alive(m)&&!m.types.some(t=>["いわ","じめん","はがね"].includes(t))&&effAbility(m)!=="すながくれ"&&m.item!=="ぼうじんゴーグル"){
          damage(m,Math.floor(m.maxhp/16),`砂あらしが${m.name}を襲う`);
        }
      }
    }
  }
  if(B.terrain){ B.terrainTurns--; if(B.terrainTurns<=0){B.terrain=null;log("フィールドが元に戻った");} }
  if(B.trickroom){ B.trickroom--; if(B.trickroom<=0)log("時空のゆがみが元に戻った"); }
  for(const p of [1,2]){
    const fx=B.sides[p].fx;
    ["reflect","light","tailwind","safeguard"].forEach(k=>{ if(fx[k]){fx[k]--; if(fx[k]<=0){fx[k]=0;log(`P${p}側の${{reflect:"リフレクター",light:"ひかりのかべ",tailwind:"おいかぜ",safeguard:"しんぴのまもり"}[k]}がなくなった`);} } });
    fx.wide=false; fx.fast=false; fx.crafty=false;
    for(const m of B.sides[p].field){
      if(!alive(m))continue;
      if(effAbility(m)==="あめうけざら"&&B.weather==="rain"){ m.hp=Math.min(m.maxhp,m.hp+Math.floor(m.maxhp/16)); }
      if(B.terrain==="grass"&&grounded(m)){ m.hp=Math.min(m.maxhp,m.hp+Math.floor(m.maxhp/16)); }
      if(alive(m)&&effAbility(m)==="ムラっけ"){
        const ks=["a","b","c","d","s"];
        const up=ks[Math.floor(Math.random()*5)];
        let dn=ks[Math.floor(Math.random()*5)]; while(dn===up)dn=ks[Math.floor(Math.random()*5)];
        const dd={}; dd[up]=2; dd[dn]=-1;
        applyBoost(m,dd,m,`${m.name}のムラっけ`);
      }
      if(m.item==="たべのこし"){ m.hp=Math.min(m.maxhp,m.hp+Math.floor(m.maxhp/16)); }
      if(effAbility(m)==="サンパワー"&&B.weather==="sun")damage(m,Math.floor(m.maxhp/8),`サンパワーで${m.name}のHPが削れた`);
      if(m.status==="brn")damage(m,Math.floor(m.maxhp/16),`${m.name}はやけどのダメージを受けた`);
      if(m.status==="psn")damage(m,Math.floor(m.maxhp/8),`${m.name}はどくのダメージを受けた`);
      if(m.status==="tox"){ m.toxN=Math.min(15,(m.toxN||0)+1); damage(m,Math.max(1,Math.floor(m.maxhp*m.toxN/16)),`${m.name}はもうどくのダメージを受けた`); }
      if(m.status!=="tox")m.toxN=0;
      if(alive(m)&&m.vol.bind){ m.vol.bind--; damage(m,Math.max(1,Math.floor(m.maxhp/8)),`${m.name}は渦のダメージを受けた`); }
      if(alive(m)&&m.vol.seed){
        const d=Math.floor(m.maxhp/8); damage(m,d,`やどりぎが${m.name}のHPを奪う`);
        const healers=B.sides[m.vol.seed].field.filter(alive);
        if(healers.length){ const h=healers[0]; h.hp=Math.min(h.maxhp,h.hp+d); }
      }
      if(alive(m)&&m.vol.yawn){ m.vol.yawn--; if(m.vol.yawn<=0&&!m.status){ applyStatus(m,"slp",null); } }
      if(alive(m)&&m.item==="かえんだま"&&!m.status){ applyStatus(m,"brn",m); }
      if(m.vol.encoreTurns){ m.vol.encoreTurns--; if(m.vol.encoreTurns<=0){m.vol.encore=null;log(`${m.name}のアンコールが解けた`);} }
      if(m.vol.taunt){ m.vol.taunt--; if(m.vol.taunt<=0)log(`${m.name}のちょうはつが解けた`); }
      if(m.vol.disableTurns){ m.vol.disableTurns--; if(m.vol.disableTurns<=0&&m.vol.disabled){ log(`${m.name}のかなしばりが解けた`); m.vol.disabled=null; } }
      if(!m.vol.protSuccess)m.vol.protCount=0;
      m.vol.protSuccess=false;
      if(!m.vol.switchSuccess)m.vol.switchCount=0;
      m.vol.switchSuccess=false;
      m.vol.protect=false; m.vol.spiky=false; m.vol.redirect=false; m.vol.redirectPow=false; m.vol.snatch=false; m.vol.movedThisTurn=false;
      if(m.vol.justEntered){ m.vol.justEntered=false; } else { m.vol.firstTurn=false; }
      m.vol.helpinghand=false;
    }
  }
  // ほろびのうたカウント: 素早い順（トリックルーム時は遅い順）に処理
  {
    const all=[];
    for(const pp of [1,2]) for(const mm of B.sides[pp].field) if(alive(mm)&&mm.vol.perish) all.push(mm);
    all.sort((x,y)=> B.trickroom ? effSpe(x)-effSpe(y) : effSpe(y)-effSpe(x));
    for(const mm of all){
      mm.vol.perish--;
      if(mm.vol.perish<=0){ log(`${mm.name}はほろびのうたでたおれた！（がんじょう・きあいのタスキでも耐えられない）`); mm.hp=0; faint(mm); }
      else log(`${mm.name}のほろびのカウント: ${mm.vol.perish}`);
    }
  }
}
function checkWin(){
  const a1=B.sides[1].team.some(m=>!m.fainted), a2=B.sides[2].team.some(m=>!m.fainted);
  if(a1&&a2)return false;
  B.winner=!a1&&!a2?0:(a1?1:2);
  log(`=== ${B.winner===0?"引き分け":"プレイヤー"+B.winner+"の勝ち"}！ ===`);
  B.phase="end"; render();
  return true;
}
/* =============== 途中交代（クイックターン等） =============== */
function rMidSwitch(app){
  const ms=B.midSwitch; const mon=ms.mon;
  let html=`<h1>ターン${B.turn}</h1>`+boardHtml(null,null,mon.side)+
   `<div class="panel"><h2>プレイヤー${mon.side}：${esc(ms.label)}！ ${esc(mon.name)}の交代先を選択</h2>`;
  benchMons(mon.side).forEach(m=>{ html+=`<button onclick="doMidSwitch('${esc(m.name)}')">${esc(m.name)} (HP ${m.hp}/${m.maxhp})</button>`; });
  html+=`</div>`+logHtml()+statsPanelHtml()+calcPanelHtml();
  app.innerHTML=html;
}
window.doMidSwitch=function(name){
  const mon=B.midSwitch.mon; B.midSwitch=null;
  if(alive(mon)&&fieldPos(mon)>=0)doSwitch(mon,name);
  B.phase="resolve";
  continueResolution();
};
/* =============== ひんし補充 =============== */
function replaceReserved(p){ return (B.pendReplace||[]).filter(x=>x.p===p).map(x=>x.name); }
function rReplace(app){
  B.pendReplace=B.pendReplace||[];
  const q=B.replaceQueue[0];
  if(!q){ finishReplace(); return; }
  // 別プレイヤーの番に移るときは受け渡し画面を挟む（相手の選出を見せない）
  const bothSides=B.replaceQueue.some(x=>x.p!==q.p)||(B.pendReplace||[]).some(x=>x.p!==q.p);
  if(!bothSides)B.replaceHandoff=q.p;
  if(B.replaceHandoff!==q.p){
    app.innerHTML=`<h1>${TX("turn",B.turn)}</h1>`+boardHtml(null,null,q.p)+logHtml()+
     `<div class="overlay"><p>プレイヤー${q.p}にデバイスを渡してください</p>
      <p class="note">ひんしのポケモンの交代要員を選びます（相手の選出は見えません）</p>
      <button class="big" onclick="B.replaceHandoff=${q.p};render()">プレイヤー${q.p}：選出する</button></div>`;
    scrollLog(); return;
  }
  const reserved=replaceReserved(q.p);
  const bench=benchMons(q.p).filter(m=>!reserved.includes(m.name));
  if(bench.length===0){ B.replaceQueue.shift(); rReplace(app); return; }
  let html=`<h1>ターン${B.turn}</h1>`+boardHtml(null,null,q.p)+
   `<div class="panel"><h2>プレイヤー${q.p}：${POSNAME[q.pos]}に出すポケモンを選択</h2>`;
  const chosen=replaceReserved(q.p);
  if(chosen.length)html+=`<div class="note">選出済み: ${chosen.map(esc).join("、")}</div>`;
  bench.forEach(m=>{ html+=`<button onclick="doReplace('${esc(m.name)}')">${esc(m.name)} (HP ${m.hp}/${m.maxhp})</button>`; });
  html+=`</div>`+logHtml()+statsPanelHtml()+calcPanelHtml();
  app.innerHTML=html;
}
window.doReplace=function(name){
  const q=B.replaceQueue.shift();
  B.pendReplace=B.pendReplace||[];
  B.pendReplace.push({p:q.p,pos:q.pos,name});
  const next=B.replaceQueue[0];
  if(next&&next.p!==q.p)B.replaceHandoff=null;
  if(B.replaceQueue.length){ render(); }
  else finishReplace();
};
function finishReplace(){
  const list=B.pendReplace||[];
  const entering=[];
  list.forEach(r=>{
    const m=B.sides[r.p].team.find(x=>!x.fainted&&x.name===r.name&&!B.sides[r.p].field.includes(x));
    if(m){ B.sides[r.p].field[r.pos]=m; m.vol.firstTurn=true; m.vol.justEntered=true; log(`P${r.p}は${m.name}を繰り出した！`); entering.push(m); }
  });
  B.pendReplace=[]; B.replaceHandoff=null; B.replaceQueue=[];
  entering.sort((a,b)=>effSpe(b)-effSpe(a)).forEach(m=>onEntry(m));
  autoCenter();
  B.inputPlayer=1; B.phase="handoff"; render();
}
/* =============== てだすけ補正 =============== */
const _origCalc=calcDamage;
calcDamage=function(att,def,name,M,opts){
  const r=_origCalc(att,def,name,M,opts);
  if(r.dmg>0&&att.vol.helpinghand){ r.dmg=Math.floor(r.dmg*1.5); }
  return r;
};
render();
</script>
