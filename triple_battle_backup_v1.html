<title>トリプルバトル</title>
<style>
  body { font-family:"Hiragino Sans","Meiryo",sans-serif; background:#1a1d24; color:#e8e8e8; margin:0; padding:14px; font-size:14px; }
  h1{font-size:20px;text-align:center;margin:6px 0 12px;} h2{font-size:16px;margin:10px 0 6px;} h3{font-size:14px;margin:8px 0 4px;color:#b8c0d0;}
  .screen{max-width:980px;margin:0 auto;}
  button{background:#3a4254;color:#e8e8e8;border:1px solid #5a6478;border-radius:6px;padding:7px 11px;margin:3px;cursor:pointer;font-size:13px;}
  button:hover{background:#4a5570;} button.sel{background:#2e7d4f;border-color:#4caf7d;} button.danger{background:#7d2e2e;} button.big{font-size:16px;padding:10px 18px;}
  button:disabled{opacity:.35;cursor:default;}
  .roster{display:flex;flex-wrap:wrap;} .roster button{width:calc(20% - 12px);text-align:left;font-size:12px;}
  .panel{background:#252a36;border:1px solid #444c60;border-radius:8px;padding:12px;margin:10px 0;}
  .note{font-size:12px;color:#9aa4b8;} .warn{color:#e0b040;font-size:12px;}
  .tag{display:inline-block;background:#3a4254;border-radius:4px;padding:1px 6px;font-size:11px;margin:2px 3px 2px 0;}
  input[type=text]{background:#12141a;color:#e8e8e8;border:1px solid #444c60;border-radius:4px;padding:6px;font-size:14px;}
  input[type=number]{background:#12141a;color:#e8e8e8;border:1px solid #444c60;border-radius:4px;padding:4px;width:52px;font-size:14px;}
  select{background:#12141a;color:#e8e8e8;border:1px solid #444c60;border-radius:4px;padding:6px;font-size:13px;}
  table.evt{border-collapse:collapse;} table.evt td,table.evt th{padding:3px 8px;font-size:13px;text-align:center;}
  .board{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
  .row{display:flex;gap:8px;justify-content:center;}
  .slot{width:190px;min-height:92px;background:#252a36;border:1px solid #444c60;border-radius:8px;padding:7px;}
  .slot .pos{font-size:11px;color:#9aa4b8;} .slot .nm{font-weight:bold;font-size:14px;margin:1px 0;} .slot .tp{font-size:11px;color:#b8c0d0;}
  .hpbar{height:8px;background:#3a2020;border-radius:4px;margin-top:5px;overflow:hidden;} .hpbar div{height:100%;background:#4caf7d;}
  .hpbar div.low{background:#e0b040;} .hpbar div.crit{background:#d05050;}
  .hpnum{font-size:11px;color:#9aa4b8;margin-top:2px;} .slot.dead{opacity:.35;} .slot.acting{border-color:#e0b040;box-shadow:0 0 0 1px #e0b040;}
  .st{display:inline-block;border-radius:3px;padding:0 4px;font-size:10px;margin-left:4px;}
  .st.brn{background:#a04030;} .st.psn{background:#7a3a8a;} .st.par{background:#9a8a20;} .st.slp{background:#607080;} .st.frz{background:#3a7a9a;} .st.mega{background:#8a3a6a;}
  #log{background:#12141a;border:1px solid #333a4a;border-radius:8px;padding:10px;font-size:13px;line-height:1.65;max-height:300px;overflow-y:auto;white-space:pre-wrap;margin-top:10px;}
  .overlay{position:fixed;inset:0;background:rgba(20,22,28,0.98);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px;}
  .overlay p{font-size:18px;}
  .mvbtn{width:calc(50% - 10px);text-align:left;}
  button.tfoe{background:#7d2e2e;border-color:#a05050;}
  button.tally{background:#2e567d;border-color:#5080a0;}
  .teamslot{display:inline-block;background:#2c3140;border:1px solid #444c60;border-radius:6px;padding:6px 10px;margin:3px;min-width:130px;font-size:12px;vertical-align:top;cursor:pointer;}
  .teamslot:hover{border-color:#7a8498;}
  label.chk{display:inline-block;background:#2c3140;border:1px solid #444c60;border-radius:6px;padding:5px 8px;margin:3px;cursor:pointer;font-size:12px;width:calc(33% - 12px);}
  label.chk.on{background:#2e7d4f;border-color:#4caf7d;}
  label.chk input{margin-right:4px;}
</style>

/* =============== ステータス計算 =============== */
function calcStats(dexIdx, ev, mega, nat){
  const d=DEX[dexIdx]; const bs=(mega&&d.mega)?d.mega.bs:d.bs;
  const st={ h:bs[0]+75+(ev.h||0), a:bs[1]+20+(ev.a||0), b:bs[2]+20+(ev.b||0), c:bs[3]+20+(ev.c||0), d:bs[4]+20+(ev.d||0), s:bs[5]+20+(ev.s||0) };
  if(nat&&nat.plus!==nat.minus){
    if(nat.plus&&nat.plus!=="none"&&st[nat.plus]!==undefined) st[nat.plus]=Math.floor(st[nat.plus]*1.1);
    if(nat.minus&&nat.minus!=="none"&&st[nat.minus]!==undefined) st[nat.minus]=Math.floor(st[nat.minus]*0.9);
  }
  return st;
}
function boostMul(st){ return st>=0 ? (2+st)/2 : 2/(2-st); }

function defaultCfg(di){
  const d=DEX[di];
  const mv=d.mv.slice(0,4).map(x=>x[0]);
  const ev={h:0,a:0,b:0,c:0,d:0,s:0};
  if(d.bs[1]>=d.bs[3]){ev.a=32;}else{ev.c=32;}
  if(d.bs[5]>=80){ev.s=32; ev.h=2;} else {ev.h=32; ev.b=2;}
  const plus = d.bs[1]>=d.bs[3] ? "a" : "c";
  const minus = plus==="a" ? "c" : "a";
  return {dex:di, ability:d.abil[0][0], moves:mv, item:(d.items[0]?d.items[0][0]:"なし"), ev, plus, minus};
}

window.createCustom=function(){

/* =============== バトルモン生成 =============== */
function mkBattleMon(cfg, side){
  const d=DEX[cfg.dex];
  const st=calcStats(cfg.dex,cfg.ev,false,{plus:cfg.plus,minus:cfg.minus});
  return {
    cfg, side, dex:cfg.dex, name:d.n, types:d.t.slice(), ability:cfg.ability, item:cfg.item, itemUsed:false,
    stats:st, hp:st.h, maxhp:st.h, status:null, slpTurns:0,
    boosts:{a:0,b:0,c:0,d:0,s:0}, isMega:false, fainted:false,
    vol:{}
  };
}
function megaEvolve(mon){
  const d=DEX[mon.dex]; if(!d.mega) return;
  const hpRatio=mon.hp;
  mon.isMega=true; mon.name=d.mega.n; mon.types=d.mega.t.slice(); mon.ability=d.mega.abil;
  const st=calcStats(mon.dex,mon.cfg.ev,true,{plus:mon.cfg.plus,minus:mon.cfg.minus});
  mon.stats=st;
  mon.hp=hpRatio;
}
/* =============== バトル状態 =============== */
let B=null;
function startBattle(){
  const mk=(p)=>S.orders[p].map(mi=>mkBattleMon(S.teams[p].mons[mi],p));
  const t1=mk(1), t2=mk(2);
  B={
    turn:1, log:[`=== バトル開始！ ===`],
    sides:{
      1:{team:t1, field:[t1[0],t1[1],t1[2]], megaUsed:false, fx:{}},
      2:{team:t2, field:[t2[0],t2[1],t2[2]], megaUsed:false, fx:{}}
    },
    weather:null, weatherTurns:0, terrain:null, terrainTurns:0, trickroom:0,
    phase:"handoff", inputPlayer:1, pending:{}, winner:null, replaceQueue:[],
  };
  B.sides[1].field.forEach(m=>m.vol.firstTurn=true);
  B.sides[2].field.forEach(m=>m.vol.firstTurn=true);
  S={mode:"battle"};
  const entries=[...B.sides[1].field.map(m=>[1,m]),...B.sides[2].field.map(m=>[2,m])];
  entries.sort((x,y)=>effSpe(y[1])-effSpe(x[1]));
  entries.forEach(([sd,m])=>onEntry(m));
  render();
}
function log(s){ B.log.push(s); }
function foeSide(s){ return s===1?2:1; }
function alive(mon){ return mon && !mon.fainted; }
function fieldPos(mon){ const f=B.sides[mon.side].field; return f.indexOf(mon); }
function reachable(myPos,foePos){ return Math.abs((2-myPos)-foePos)<=1; }
function ignoresReach(M){ return M.t==="ひこう"||M.pul; }
function grounded(mon){ return !(mon.types.includes("ひこう")||mon.ability==="ふゆう"); }
/* =============== 特性・場効果 =============== */
function onEntry(mon){
  const a=mon.ability;
  if(a==="ひでり"){ setWeather("sun",mon); }
  if(a==="あめふらし"){ setWeather("rain",mon); }
  if(a==="すなおこし"){ setWeather("sand",mon); }
  if(a==="サイコメイカー"){ B.terrain="psy"; B.terrainTurns=5; log(`${mon.name}のサイコメイカー！足下がふしぎな感じになった！`); }
  if(a==="グラスメイカー"){ B.terrain="grass"; B.terrainTurns=5; log(`${mon.name}のグラスメイカー！足下に草がしげった！`); }
  if(a==="いかく"){
    const fs=B.sides[foeSide(mon.side)].field; const p=fieldPos(mon);
    fs.forEach((f,fp)=>{ if(alive(f)&&reachable(p,fp)){ applyBoost(f,{a:-1},mon,`${mon.name}のいかく`); } });
  }
  if(a==="ダウンロード"){
    const fs=B.sides[foeSide(mon.side)].field.filter(alive);
    if(fs.length){ const sumB=fs.reduce((s,f)=>s+f.stats.b,0), sumD=fs.reduce((s,f)=>s+f.stats.d,0);
      applyBoost(mon, sumB<sumD?{a:1}:{c:1}, mon, `${mon.name}のダウンロード`); }
  }
  if(a==="おもてなし"){
    const allies=B.sides[mon.side].field.filter(m=>alive(m)&&m!==mon);
    allies.forEach(t=>{ t.hp=Math.min(t.maxhp,t.hp+Math.floor(t.maxhp/4)); });
    if(allies.length) log(`${mon.name}のおもてなし！味方のHPが回復した！`);
  }
  if(a==="トレース"){
    const foes=B.sides[foeSide(mon.side)].field.filter(alive);
    if(foes.length){
      const t=foes[Math.floor(Math.random()*foes.length)];
      if(t.ability&&t.ability!=="トレース"){
        mon.ability=t.ability;
        log(`${mon.name}のトレース！${t.name}の${t.ability}をコピーした！`);
        onEntry(mon);
      }
    }
  }
  if(a==="きょうえん"){
    const f=B.sides[mon.side].field; const pos=fieldPos(mon);
    const allies=f.filter(m=>alive(m)&&m!==mon);
    let src=null;
    if(pos!==1){ if(alive(f[1])&&f[1]!==mon)src=f[1]; }
    else if(allies.length){
      const sum=x=>["a","b","c","d","s"].reduce((s,k)=>s+Math.max(0,x.boosts[k]),0);
      allies.sort((x,y)=>sum(y)-sum(x));
      src = (allies.length>1&&sum(allies[0])===sum(allies[1])) ? allies[Math.floor(Math.random()*allies.length)] : allies[0];
    }
    if(src&&["a","b","c","d","s"].some(k=>src.boosts[k]!==0)){
      mon.boosts={...src.boosts};
      log(`${mon.name}のきょうえん！${src.name}の能力変化をコピーした！`);
    }
  }
}
function setWeather(w,mon){
  if(B.weather===w) return;
  B.weather=w;
  let turns=5;
  if(mon&&mon.item==="しめったいわ"&&w==="rain")turns=8;
  if(mon&&mon.item==="あついいわ"&&w==="sun")turns=8;
  B.weatherTurns=turns;
  log(w==="sun"?"日ざしが強くなった！":w==="rain"?"雨が降り始めた！":"砂あらしが吹き始めた！");
}
function applyBoost(mon,delta,src,label){
  const isSelf = src===mon;
  let d={...delta};
  if(mon.ability==="あまのじゃく"){ for(const k in d) d[k]=-d[k]; }
  const lowering = Object.values(d).some(v=>v<0);
  if(!isSelf && lowering){
    if(mon.ability==="クリアボディ"||mon.ability==="しろいけむり"){ log(`${mon.name}は${mon.ability}で能力が下がらない！`); return; }
    const allies=B.sides[mon.side].field;
    if(mon.types.includes("くさ") && allies.some(m=>alive(m)&&m.ability==="フラワーベール")){ log(`フラワーベールで${mon.name}の能力は下がらない！`); return; }
  }
  let changed=[];
  for(const k in d){
    if(!d[k])continue;
    const old=mon.boosts[k];
    mon.boosts[k]=Math.max(-6,Math.min(6,old+d[k]));
    if(mon.boosts[k]!==old) changed.push(`${STATN[k]}が${mon.boosts[k]>old?"上がった":"下がった"}`);
  }
  if(changed.length){ log(`${label?label+"！ ":""}${mon.name}の${changed.join("、")}！`);
    if(!isSelf && lowering && mon.ability==="まけんき"){ mon.boosts.a=Math.min(6,mon.boosts.a+2); log(`${mon.name}のまけんき！攻撃がぐーんと上がった！`); }
    if(Object.values(mon.boosts).some(v=>v<0) && mon.item==="しろいハーブ" && !mon.itemUsed){
      for(const k in mon.boosts) if(mon.boosts[k]<0) mon.boosts[k]=0;
      consumeItem(mon); log(`${mon.name}はしろいハーブで能力ダウンを回復した！`);
    }
  }
}
function consumeItem(mon){ mon.item="なし"; mon.itemUsed=true; if(mon.ability==="かるわざ")mon.vol.unburden=true; }
function effSpe(mon){
  let s=mon.stats.s*boostMul(mon.boosts.s);
  if(mon.status==="par")s*=0.5;
  if(mon.item==="こだわりスカーフ")s*=1.5;
  if(mon.ability==="すいすい"&&B.weather==="rain")s*=2;
  if(mon.ability==="ようりょくそ"&&B.weather==="sun")s*=2;
  if(mon.vol.unburden)s*=2;
  if(B.sides[mon.side].fx.tailwind)s*=2;
  return s;
}
/* =============== 画面（バトル） =============== */
function slotHtml(mon,posLabel,acting){
  if(!mon) return `<div class="slot dead"><div class="pos">${posLabel}</div><div class="nm">（空き）</div></div>`;
  const pct=Math.max(0,mon.hp/mon.maxhp*100);
  const cls=pct<=25?"crit":(pct<=50?"low":"");
  const stTag=mon.status?`<span class="st ${mon.status}">${{brn:"やけど",psn:"どく",par:"まひ",slp:"ねむり",frz:"こおり"}[mon.status]}</span>`:"";
  const megaTag=mon.isMega?`<span class="st mega">メガ</span>`:"";
  const boosts=STATKEYS.slice(1).filter(k=>mon.boosts[k]!==0).map(k=>`${STATN[k]}${mon.boosts[k]>0?"+":""}${mon.boosts[k]}`).join(" ");
  return `<div class="slot ${acting?"acting":""}"><div class="pos">${posLabel}</div><div class="nm">${esc(mon.name)}${megaTag}${stTag}</div>
   <div class="tp">${mon.types.join("/")} ${mon.item!=="なし"?"@"+esc(mon.item):""}</div>
   <div class="hpbar"><div class="${cls}" style="width:${pct}%"></div></div>
   <div class="hpnum">HP ${Math.max(0,mon.hp)}/${mon.maxhp} ${boosts?`<span class="note">${boosts}</span>`:""}</div></div>`;
}
function boardHtml(activeSide,activePos){
  const f1=B.sides[1].field, f2=B.sides[2].field;
  const cond=[];
  if(B.weather)cond.push({sun:"晴れ",rain:"あめ",sand:"砂あらし"}[B.weather]);
  if(B.terrain==="psy")cond.push("サイコフィールド");
  if(B.terrain==="grass")cond.push("グラスフィールド");
  if(B.trickroom)cond.push("トリックルーム");
  [1,2].forEach(p=>{const fx=B.sides[p].fx; const t=[]; if(fx.reflect)t.push("リフレクター"); if(fx.light)t.push("ひかりのかべ"); if(fx.tailwind)t.push("おいかぜ"); if(t.length)cond.push(`P${p}:${t.join("/")}`);});
  let html=`<div class="note" style="text-align:center;">${cond.join("　")||""}</div><div class="board"><div class="note" style="text-align:center;">プレイヤー2　控え:${benchList(2)}</div><div class="row">`;
  [2,1,0].forEach(p=>{ html+=slotHtml(f2[p],"P2の"+POSNAME[p],activeSide===2&&activePos===p); });
  html+=`</div><div class="row">`;
  [0,1,2].forEach(p=>{ html+=slotHtml(f1[p],"P1の"+POSNAME[p],activeSide===1&&activePos===p); });
  html+=`</div><div class="note" style="text-align:center;">プレイヤー1　控え:${benchList(1)}</div></div>`;
  return html;
}
function benchList(p){

function benchMons(p){ return B.sides[p].team.filter(m=>!m.fainted && !B.sides[p].field.includes(m)); }
function rBattle(app){

    app.innerHTML=`<h1>ターン${B.turn}</h1>`+boardHtml()+logHtml()+

function logHtml(){ return `<div id="log">${B.log.map(esc).join("\n")}</div>`; }

/* =============== コマンド入力 =============== */
window.startInput=function(){
  B.phase="input";

function lockedAction(mon){

}
function rInput(app){
  const pl=B.inputPlayer, fs=B.sides[pl].field;
  if(B.cmdIdx>=B.cmdList.length){ finishInput(); return; }
  const pos=B.cmdList[B.cmdIdx]; const mon=fs[pos];
  const lock=lockedAction(mon);
  if(lock){ B.cmd.acts[pos]={kind:lock.kind, pos}; B.cmdIdx++; rInput(app); return; }
  let html=`<h1>ターン${B.turn}｜プレイヤー${pl} 入力</h1>`+boardHtml(pl,pos);
  html+=`<div class="panel"><h2>${POSNAME[pos]}：${esc(mon.name)} の行動</h2>`;
  const done=Object.keys(B.cmd.acts).map(p=>{
    const a=B.cmd.acts[p]; const m=fs[p];
    if(a.kind==="move")return `${m.name}:${a.move}`;
    if(a.kind==="shift")return `${m.name}:ムーブ`;
    if(a.kind==="switch")return `${m.name}:交代`;
    return `${m.name}:行動固定`;
  });
  if(done.length)html+=`<div class="note">決定済み: ${done.map(esc).join(" ／ ")}</div>`;
  if(B.sub==="action"){
    const d=DEX[mon.dex];
    if(d.mega && !mon.isMega && !B.sides[pl].megaUsed && mon.item===d.mega.stone){
      const on=B.cmd.mega===pos;
      html+=`<div><label class="chk ${on?"on":""}" style="width:auto;"><input type="checkbox" ${on?"checked":""} onchange="toggleMega(${pos})">このターン、メガシンカする！</label></div>`;
    }
    let usable=mon.cfg.moves.slice();
    if(mon.vol.encore && usable.includes(mon.vol.encore)) usable=[mon.vol.encore];
    if(mon.vol.choiceMove && mon.item==="こだわりスカーフ" && usable.includes(mon.vol.choiceMove)) usable=[mon.vol.choiceMove];
    usable.forEach(name=>{
      const M=MOVES[name];
      let dis="";
      if(mon.vol.taunt && M.cat==="X") dis="disabled";
      if(mon.item==="とつげきチョッキ" && M.cat==="X") dis="disabled";
      if(name==="ブラッドムーン" && mon.vol.lastMove==="ブラッドムーン") dis="disabled";
      const info=M.cat==="X"?"変化":`${M.t} ${M.cat==="P"?"物理":"特殊"} 威力${M.p}`;
      html+=`<button class="mvbtn" ${dis} onclick="pickMove('${name}')">${name}<br><span class="note">${info}${rangeNote(M)}</span></button>`;
    });
    html+=`<br>`;
    if(pos!==1) html+=`<button onclick="pickShift(${pos})">ムーブ（中央と入替）</button>`;
    const bench=availableBench(pl);
    if(bench.length) html+=`<button onclick="B.sub='switch';render()">交代する</button>`;
    if(B.cmdIdx>0) html+=`<button class="danger" onclick="backCmd()">前に戻る</button>`;
  } else if(B.sub==="switch"){
    html+=`<div>交代先を選択:</div>`;
    availableBench(pl).forEach(m=>{
      html+=`<button onclick="pickSwitch(${pos},'${esc(m.name)}')">${esc(m.name)} (HP ${m.hp}/${m.maxhp})</button>`;
    });
    html+=`<br><button class="danger" onclick="B.sub='action';render()">戻る</button>`;
  } else {
    const name=B.chosenMove; const M=MOVES[name];
    html+=`<div>技: ${esc(name)} → 対象を選択</div>`;
    const tgts=legalTargets(mon,pos,M);
    if(tgts.length===0) html+=`<div class="note">対象がいません（そのまま選ぶと失敗します）</div><button onclick="pickTarget(-1,-1)">それでも使う</button>`;
    tgts.forEach(([ts,tp])=>{
      const t=B.sides[ts].field[tp];
      html+=`<button class="${ts===pl?"tally":"tfoe"}" onclick="pickTarget(${ts},${tp})">${ts===pl?"味方":"相手"}の${POSNAME[tp]} ${esc(t.name)}</button>`;
    });
    html+=`<br><button class="danger" onclick="B.sub='action';B.chosenMove=null;render()">技選択に戻る</button>`;
  }
  html+=`</div>`+logHtml();
  app.innerHTML=html;
}
function availableBench(pl){
  const reserved=Object.values(B.cmd.acts).filter(a=>a.kind==="switch").map(a=>a.benchName);

function legalTargets(mon,pos,M){
  const pl=mon.side, fp=foeSide(pl);
  const res=[];
  if(M.rng==="ALLY"){
    B.sides[pl].field.forEach((m,p2)=>{ if(alive(m)&&m!==mon&&(!M.adj||Math.abs(p2-pos)===1))res.push([pl,p2]); });
  } else if(M.rng==="S"){
    B.sides[fp].field.forEach((m,p2)=>{ if(alive(m)&&(ignoresReach(M)||reachable(pos,p2)))res.push([fp,p2]); });
    B.sides[pl].field.forEach((m,p2)=>{ if(alive(m)&&m!==mon&&(ignoresReach(M)||Math.abs(p2-pos)===1))res.push([pl,p2]); });
  }
  return res;
}
window.toggleMega=function(pos){ B.cmd.mega=(B.cmd.mega===pos)?null:pos; render(); };
window.pickMove=function(name){

/* =============== ダメージ計算 =============== */
function typeEff(att,M,mType,def){
  let e=1;
  for(const t of def.types){
    let m=(CHART[mType]&&CHART[mType][t]!==undefined)?CHART[mType][t]:1;
    if(m===0){
      if(t==="ゴースト"&&(mType==="ノーマル"||mType==="かくとう")&&(att.ability==="きもったま"||att.ability==="しんがん"))m=1;
    }
    e*=m;
  }
  return e;
}
function moveTypeOf(att,name,M){
  let mt=M.t;
  if(M.fx==="weatherball"){ mt = B.weather==="sun"?"ほのお":B.weather==="rain"?"みず":B.weather==="sand"?"いわ":"ノーマル"; }
  if(att.ability==="フェアリースキン"&&mt==="ノーマル") mt="フェアリー";
  return mt;
}
function movePowerOf(att,name,M,def){
  let p=M.p;
  if(M.fx==="weatherball"&&B.weather)p=100;
  if(M.fx==="hpscale")p=Math.max(1,Math.floor(150*att.hp/att.maxhp));
  if(M.fx==="lastrespects"){ const f=B.sides[att.side].team.filter(m=>m.fainted).length; p=50+50*Math.min(f,5); }
  if(M.fx==="facade"&&att.status)p=140;
  if(M.fx==="storedpower"){ p=20+20*STATKEYS.slice(1).reduce((s,k)=>s+Math.max(0,att.boosts[k]),0); }
  if(M.fx==="expandingforce"&&B.terrain==="psy")p=Math.floor(p*1.5);
  if(M.fx==="knockoff"&&def&&def.item!=="なし"&&!ITEMS[def.item].stone)p=Math.floor(p*1.5);
  if(att.ability==="フェアリースキン"&&M.t==="ノーマル")p=Math.floor(p*1.2);
  if(att.ability==="すてみ"&&M.recoil)p=Math.floor(p*1.2);
  if(M.fx==="acrobatics"&&att.item==="なし")p*=2;
  if(B.terrain==="grass"&&name==="じしん")p=Math.floor(p/2);
  if(att.ability==="テクニシャン"&&p<=60)p=Math.floor(p*1.5);
  return p;
}
function calcDamage(att,def,name,M,opts){
  const mt=moveTypeOf(att,name,M);
  if(mt==="じめん"&&!grounded(def)&&att.ability!=="かたやぶり") return {dmg:0,eff:0,imm:`${def.name}には当たらない`};
  const eff=typeEff(att,M,mt,def);
  if(eff===0) return {dmg:0,eff:0};
  const p=movePowerOf(att,name,M,def);
  if(p<=0) return {dmg:0,eff:1};
  const phys = M.fx==="psyshock" ? false : M.cat==="P";
  const defPhys = M.fx==="psyshock" ? true : M.cat==="P";
  let A;
  if(M.fx==="foulplay") A=def.stats.a*boostMul(def.boosts.a);
  else if(M.fx==="bodypress") A=att.stats.b*boostMul(att.boosts.b);
  else A = M.cat==="P" ? att.stats.a*boostMul(att.boosts.a) : att.stats.c*boostMul(att.boosts.c);
  let D = defPhys ? def.stats.b*boostMul(def.boosts.b) : def.stats.d*boostMul(def.boosts.d);
  if(!defPhys && B.weather==="sand"&&def.types.includes("いわ"))D*=1.5;
  if(def.item==="しんかのきせき")D*=1.5;
  if(!defPhys && def.item==="とつげきチョッキ")D*=1.5;
  if(B.weather==="sun"){
    if(M.cat==="P"&&M.fx!=="foulplay"&&M.fx!=="bodypress"&&B.sides[att.side].field.some(m=>alive(m)&&m.ability==="フラワーギフト"))A*=1.5;
    if(!defPhys&&B.sides[def.side].field.some(m=>alive(m)&&m.ability==="フラワーギフト"))D*=1.5;
  }
  let dmg=(22*p*(A/D))/50+2;
  let mod=1;
  if(opts.spread)mod*=0.75;
  if(B.weather==="sun"){ if(mt==="ほのお")mod*=1.5; if(mt==="みず")mod*=0.5; }
  if(B.weather==="rain"){ if(mt==="みず")mod*=1.5; if(mt==="ほのお")mod*=0.5; }
  if(B.terrain==="psy"&&mt==="エスパー"&&grounded(att))mod*=1.3;
  if(B.terrain==="grass"&&mt==="くさ"&&grounded(att))mod*=1.3;
  let crit=false;
  const critChance=M.crit?1/8:1/24;
  if(def.ability!=="シェルアーマー"&&Math.random()<critChance){crit=true;mod*=1.5;}
  const dfx=B.sides[def.side].fx;
  if(!crit&&att.ability!=="すりぬけ"){
    if(defPhys&&dfx.reflect)mod*=0.5;
    if(!defPhys&&dfx.light)mod*=0.5;
  }
  if(att.types.includes(mt))mod*=(att.ability==="てきおうりょく")?2:1.5;
  mod*=eff;
  if(phys&&att.status==="brn"&&att.ability!=="こんじょう")mod*=0.5;
  if(att.ability==="かたいツメ"&&M.c)mod*=1.3;
  if(att.ability==="メガランチャー"&&M.pul)mod*=1.5;
  if(att.ability==="フェアリーオーラ"&&mt==="フェアリー")mod*=1.33;
  if(att.ability==="こんじょう"&&att.status&&phys)mod*=1.5;
  if(att.ability==="サンパワー"&&B.weather==="sun"&&M.cat==="S")mod*=1.5;
  if((att.ability==="もうか"&&mt==="ほのお"||att.ability==="げきりゅう"&&mt==="みず"||att.ability==="しんりょく"&&mt==="くさ")&&att.hp<=att.maxhp/3)mod*=1.5;
  if(att.ability==="そうだいしょう"){ const f=B.sides[att.side].team.filter(m=>m.fainted).length; mod*=(1+0.1*f); }
  if(att.ability!=="かたやぶり"){
    if(def.ability==="あついしぼう"&&(mt==="ほのお"||mt==="こおり"))mod*=0.5;
    if(def.ability==="たいねつ"&&mt==="ほのお")mod*=0.5;
  }
  if(att.item==="いのちのたま")mod*=1.3;
  const typeBoost={"くろいメガネ":"あく","もくたん":"ほのお","しんぴのしずく":"みず","ようせいのハネ":"フェアリー","メタルコート":"はがね","のろいのおふだ":"ゴースト","するどいくちばし":"ひこう","まがったスプーン":"エスパー"};
  if(typeBoost[att.item]===mt)mod*=1.2;
  if(att.item==="たつじんのおび"&&eff>1)mod*=1.2;
  if(def.item&&ITEMS[def.item]&&ITEMS[def.item].berry===mt&&eff>1&&!def.itemUsed){
    const blocked = B.sides[att.side].field.some(m=>alive(m)&&m.ability==="きんちょうかん");
    if(!blocked){ mod*=0.5; log(`${def.name}は${def.item}で威力を弱めた！`); consumeItem(def); }
  }
  dmg=Math.max(1,Math.floor(dmg*mod*(0.85+Math.random()*0.15)));
  return {dmg,eff,crit,mt};
}
/* =============== ターン解決 =============== */
function resolveTurn(){
  log(`--- ターン${B.turn} ---`);
  const acts=[];
  for(const p of [1,2]){
    const pen=B.pending[p];
    for(const k in pen.acts){
      const a=pen.acts[k]; const mon=B.sides[p].field[a.pos];
      if(alive(mon)) acts.push({side:p,mon,a});
    }
  }
  const switches=acts.filter(x=>x.a.kind==="switch").sort((x,y)=>effSpe(y.mon)-effSpe(x.mon));
  for(const sw of switches){ doSwitch(sw.mon, sw.a.benchName); }
  for(const p of [1,2]){
    const mp=B.pending[p].mega;
    if(mp!==null&&mp!==undefined){
      const mon=B.sides[p].field[mp];
      if(alive(mon)&&!mon.isMega&&DEX[mon.dex].mega&&!B.sides[p].megaUsed){
        B.sides[p].megaUsed=true;
        const old=mon.name;
        megaEvolve(mon);
        log(`${old}は${mon.name}にメガシンカした！`);
        onEntry(mon);
      }
    }
  }
  let moveActs=acts.filter(x=>x.a.kind!=="switch");
  B.exec={remaining:moveActs, movedSet:new Set()};
  continueResolution();
}
function actPrio(x){
  let prio=0;
  if(x.a.kind==="move"){
    const M=MOVES[x.a.move]; prio=M.prio||0;
    if(x.mon.ability==="いたずらごころ"&&M.cat==="X")prio+=1;
    if(x.mon.ability==="はやてのつばさ"&&M.t==="ひこう"&&x.mon.hp===x.mon.maxhp)prio+=1;
    if(M.fx==="grassyglide"&&B.terrain==="grass")prio+=1;
  }
  return prio;
}
function continueResolution(){
  const E=B.exec;
  for(;;){
    E.remaining=E.remaining.filter(x=>alive(x.mon)&&fieldPos(x.mon)>=0);
    if(E.remaining.length===0)break;
    let best=null, bestSpd=0, bestPrio=0;
    for(const x of E.remaining){
      const pr=actPrio(x);
      const spd=(B.trickroom? -effSpe(x.mon) : effSpe(x.mon))+Math.random()*0.01;
      if(!best||pr>bestPrio||(pr===bestPrio&&spd>bestSpd)){ best=x; bestSpd=spd; bestPrio=pr; }
    }
    E.remaining.splice(E.remaining.indexOf(best),1);
    execAction(best, E.movedSet, E.remaining);
    E.movedSet.add(best.mon);
    if(checkWin())return;
    if(B.midSwitch){ B.phase="midswitch"; render(); return; }
  }
  endOfTurn();
  if(checkWin())return;
  B.replaceQueue=[];
  for(const p of [1,2]){
    B.sides[p].field=B.sides[p].field.map(m=>(m&&m.fainted)?null:m);
    B.sides[p].field.forEach((m,pos)=>{
      if(m===null&&benchMons(p).length>0)B.replaceQueue.push({p,pos});
    });
  }
  B.turn++;
  B.pending={};
  if(B.replaceQueue.length){ B.phase="replace"; render(); return; }
  autoCenter();
  B.inputPlayer=1; B.phase="handoff"; render();
}
function autoCenter(){
  const f1=B.sides[1].field, f2=B.sides[2].field;
  const a1=[0,1,2].filter(i=>alive(f1[i])), a2=[0,1,2].filter(i=>alive(f2[i]));
  if(a1.length===0||a2.length===0)return;
  let reach=false;
  for(const i of a1)for(const j of a2){ if(Math.abs(2-i-j)<=1)reach=true; }
  if(reach)return;
  [1,2].forEach(p=>{ const f=B.sides[p].field; const idx=f.findIndex(m=>alive(m)); if(idx>=0&&idx!==1){ f[1]=f[idx]; f[idx]=null; } });
  log("お互いの攻撃が届かないため自動リセットムーブ！両者のポケモンが中央へ移動した");
}
function doSwitch(mon, benchName){
  const p=mon.side;
  const bench=benchMons(p).find(m=>m.name===benchName);
  const pos=fieldPos(mon);
  if(!bench||pos<0)return;
  if(mon.ability==="さいせいりょく"&&mon.hp>0){ mon.hp=Math.min(mon.maxhp,mon.hp+Math.floor(mon.maxhp/3)); }
  mon.boosts={a:0,b:0,c:0,d:0,s:0}; mon.vol={};
  B.sides[p].field[pos]=bench;
  bench.vol.firstTurn=true;
  log(`P${p}は${mon.name}を引っ込めて${bench.name}を繰り出した！`);

function protectedCheck(att,def,M,isSpread){
  const dfx=B.sides[def.side].fx;

    if(M.fx==="feint"){ def.vol.protect=false; log(`${att.name}のフェイント！${def.name}の守りを打ち破った！`); return false; }
    return "protect";
  }
  if(isSpread&&dfx.wide)return "wide";
  let eprio=(M.prio||0);
  if(M.fx==="grassyglide"&&B.terrain==="grass")eprio+=1;
  if(att.ability==="はやてのつばさ"&&M.t==="ひこう"&&att.hp===att.maxhp)eprio+=1;
  if(eprio>0&&M.cat!=="X"&&dfx.fast)return "fast";
  if(eprio>0&&att.side!==def.side&&B.sides[def.side].field.some(m=>alive(m)&&m.ability==="テイルアーマー"))return "armortail";
  if(eprio>0&&B.terrain==="psy"&&grounded(def)&&att.side!==def.side)return "terrain";
  return false;
}
function execAction(x, movedSet, allActs){
  const mon=x.mon, a=x.a, p=x.side;
  if(a.kind==="recharge"){ mon.vol.recharge=false; log(`${mon.name}は攻撃の反動で動けない！`); return; }
  if(mon.status==="slp"){
    if(mon.slpTurns>0){
      mon.slpTurns--;
      log(`${mon.name}はぐうぐう眠っている…`);
      if(a.kind==="move"&&a.move==="ねごと"){
        const pool=(mon.cfg.moves||[]).filter(n=>n!=="ねごと"&&MOVES[n]);
        if(pool.length){
          const nm=pool[Math.floor(Math.random()*pool.length)];
          log(`P${p} ${mon.name}のねごと！（${nm}）`);
          execMove(mon,nm,MOVES[nm],{ts:-1,tp:-1},movedSet,allActs);
        }
      }
      return;
    }
    mon.status=null; log(`${mon.name}は目を覚ました！`);
  }
  if(mon.status==="frz"){
    if(Math.random()<0.2){ mon.status=null; log(`${mon.name}のこおりが溶けた！`); }
    else { log(`${mon.name}は凍って動けない！`); return; }
  }
  if(mon.vol.flinch){ mon.vol.flinch=false;
    if(mon.ability!=="せいしんりょく"){ log(`${mon.name}はひるんで動けない！`); return; }
  }
  if(mon.status==="par"&&Math.random()<0.1){ log(`${mon.name}は体がしびれて動けない！`); return; }
  if(mon.vol.confusion){
    mon.vol.confusion--;
    if(mon.vol.confusion<=0){ log(`${mon.name}の混乱が解けた！`); }
    else if(Math.random()<0.33){
      log(`${mon.name}は混乱している！`);
      const cd=Math.max(1,Math.floor((22*40*(mon.stats.a*boostMul(mon.boosts.a)/(mon.stats.b*boostMul(mon.boosts.b))))/50+2));
      damage(mon,cd,`わけもわからず自分を攻撃した`);
      return;
    } else log(`${mon.name}は混乱している！`);
  }
  if(a.kind==="shift"){
    const cur=fieldPos(mon);
    if(cur===1){ log(`${mon.name}のムーブは失敗した（既に中央）`); return; }
    const f=B.sides[p].field; const other=f[1];
    f[1]=mon; f[cur]=other||null;
    log(`P${p} ${mon.name}はムーブで中央へ移動！${other?`（${other.name}は${POSNAME[cur]}へ）`:""}`);
    return;
  }
  let name, M, targetInfo;
  if(a.kind==="chargefire"){
    name=mon.vol.charging.move; M=MOVES[name];
    targetInfo={ts:mon.vol.charging.ts, tp:mon.vol.charging.tp};
    mon.vol.charging=null;
  } else {
    name=a.move; M=MOVES[name];
    targetInfo={ts:a.ts, tp:a.tp};
    if(mon.vol.encore&&MOVES[mon.vol.encore]&&name!==mon.vol.encore){
      log(`${mon.name}はアンコールで${mon.vol.encore}しか出せない！`);
      name=mon.vol.encore; M=MOVES[name];
    }
  }
  if(M.fx==="solar"&&a.kind!=="chargefire"){
    if(B.weather!=="sun"){
      mon.vol.charging={move:name,ts:targetInfo.ts,tp:targetInfo.tp};
      log(`${mon.name}は日光を吸収している！`); return;
    }
  }
  if(M.fx==="electroshot"&&a.kind!=="chargefire"){
    applyBoost(mon,{c:1},mon,`${mon.name}は電気を溜めている`);
    if(B.weather!=="rain"){
      mon.vol.charging={move:name,ts:targetInfo.ts,tp:targetInfo.tp};
      return;
    }
  }
  mon.vol.lastMove=name;
  mon.vol.lastTarget=targetInfo;
  if(mon.item==="こだわりスカーフ")mon.vol.choiceMove=name;
  if(M.fx==="fakeout"&&!mon.vol.firstTurn){ log(`${mon.name}のねこだまし！しかし失敗した`); return; }
  log(`P${p} ${mon.name}（${POSNAME[fieldPos(mon)]}）の ${name}！`);
  execMove(mon,name,M,targetInfo,movedSet,allActs);
}
function execMove(mon,name,M,targetInfo,movedSet,allActs){

    if(redir&&ts===fp){ tp=fieldPos(redir); }
    let t=(ts>=0&&ts!==null)?B.sides[ts].field[tp]:null;
    let valid=false;

      else valid=(ignoresReach(M)||reachable(pos,tp));
    }
    if(!valid){
      const cands=legalTargets(mon,pos,M).filter(([s,i])=>s===fp).map(([s,i])=>[s,i,B.sides[s].field[i]]);
      if(cands.length===0){ log(`　しかし届く相手がいない…失敗！`); return; }
      const c=cands[Math.floor(Math.random()*cands.length)]; ts=c[0];tp=c[1];t=c[2];
    }
    targets=[[ts,tp,t]];
  }
  if(targets.length===0){ log(`　しかし相手がいない…失敗！`); return; }
  const isSpreadMove=(M.rng==="SP"||M.rng==="ADJ");
  const isSpread=targets.length>1;
  if(M.fx==="sucker"){
    const t=targets[0][2];
    const tAct=allActs.find(x=>x.mon===t);
    const willAttack=tAct&&tAct.a.kind==="move"&&MOVES[tAct.a.move].cat!=="X"&&!movedSet.has(t);

    }

      const rod=B.sides[ts].field.find(m=>alive(m)&&m.ability==="ひらいしん");
      if(rod&&rod!==def&&ts===fp){ def=rod; log(`　${rod.name}のひらいしんが電気を引き寄せた！`); }
      if(def.ability==="ひらいしん"){ applyBoost(def,{c:1},def,`${def.name}のひらいしん`); log(`　${def.name}には効かない！`); continue; }
    }

    const prot=protectedCheck(mon,def,M,isSpreadMove);
    if(prot){ log(`　${def.name}は${prot==="protect"?"まもっている":prot==="wide"?"ワイドガードに守られた":prot==="fast"?"ファストガードに守られた":prot==="armortail"?"テイルアーマーで先制技を防がれた":"サイコフィールドで先制技を防がれた"}！`); continue; }
    let acc=M.acc;
    if(M.fx==="hurricane"){ if(B.weather==="rain")acc=0; else if(B.weather==="sun")acc=50; }
    if(mon.ability==="ノーガード"||def.ability==="ノーガード")acc=0;
    if(acc){
      let hitChance=acc/100;
      if(mon.item==="こうかくレンズ")hitChance*=1.1;
      if(def.ability==="すながくれ"&&B.weather==="sand")hitChance*=0.8;
      if(def.item==="ひかりのこな")hitChance*=0.9;
      if(Math.random()>hitChance){ log(`　${def.name}には当たらなかった！`); continue; }
    }
    if(def.side===p&&def.ability==="テレパシー"){ log(`　${def.name}はテレパシーで攻撃をかわした！`); continue; }
    if(M.fx==="finalgambit"){
      const d=mon.hp;
      damage(def,d,`${mon.name}のいのちがけ`);
      mon.hp=0; faint(mon);
      anyHit=true; continue;
    }
    const hits=M.hits||1;
    let dealt=0; let lastRes=null;
    for(let h=0;h<hits;h++){
      if(!alive(def))break;
      const res=calcDamage(mon,def,name,M,{spread:isSpread});
      lastRes=res;
      if(res.eff===0){ log(`　${def.name}には${res.imm||"効果がないようだ"}…`); break; }
      dealt+=damage(def,res.dmg,null,{noFaint:true});
      anyHit=true;
      if(def.hp<=0)break;
    }
    if(dealt>0&&lastRes){
      let note=lastRes.eff>1?"効果はバツグン！":(lastRes.eff<1?"効果はいまひとつ…":"");
      log(`　→ ${def.name}に${dealt}ダメージ${lastRes.crit?"（急所！）":""}${note?`（${note}）`:""}`);
      totalDealt+=dealt;
      if(def.hp<=0&&!def.fainted)faint(def);
      if(M.drain){ const heal=Math.max(1,Math.floor(dealt*M.drain)); mon.hp=Math.min(mon.maxhp,mon.hp+heal); log(`　${mon.name}はHPを吸い取った！`); }
      if(M.sec&&alive(def)&&Math.random()*100<M.sec.ch){
        if(M.sec.fl&&!movedSet.has(def))def.vol.flinch=true;
        if(M.sec.st)applyStatus(def,M.sec.st,mon);
        if(M.sec.stat)applyBoost(def,M.sec.stat,mon,``);
        if(M.sec.selfstat)applyBoost(mon,M.sec.selfstat,mon,``);
      }
      if(M.fx==="direclaw"&&alive(def)&&Math.random()<0.5){
        applyStatus(def,["psn","par","slp"][Math.floor(Math.random()*3)],mon);
      }
      if(M.fx==="triattack"&&alive(def)&&Math.random()<0.2){
        applyStatus(def,["brn","par"][Math.floor(Math.random()*2)],mon);
      }
      if(M.fx==="clearsmog"&&alive(def)){ def.boosts={a:0,b:0,c:0,d:0,s:0}; log(`　${def.name}の能力変化が元に戻った！`); }
      if(M.fx==="knockoff"&&alive(def)&&def.item!=="なし"&&!ITEMS[def.item].stone){ log(`　${mon.name}は${def.name}の${def.item}をはたき落とした！`); def.item="なし"; }
      if(M.fx==="breakscreen"){ const dfx=B.sides[def.side].fx; if(dfx.reflect||dfx.light){dfx.reflect=0;dfx.light=0;log(`　壁が砕け散った！`);} }
      if(M.fx==="dragontail"&&alive(def)){
        const bn=benchMons(def.side);
        if(bn.length){ const nb=bn[Math.floor(Math.random()*bn.length)]; doSwitch(def,nb.name); }
      }
      if(M.c&&alive(def)){
        if(def.ability==="さめはだ"){ damage(mon,Math.floor(mon.maxhp/8),`${def.name}のさめはだ`); }
        if(def.item==="ゴツゴツメット"){ damage(mon,Math.floor(mon.maxhp/6),`${def.name}のゴツゴツメット`); }
        if(def.ability==="せいでんき"&&Math.random()<0.3)applyStatus(mon,"par",def);
        if(def.ability==="ほのおのからだ"&&Math.random()<0.3)applyStatus(mon,"brn",def);
        if(mon.ability==="どくしゅ"&&Math.random()<0.3)applyStatus(def,"psn",mon);
      }
      if(alive(def)&&def.ability==="じきゅうりょく")applyBoost(def,{b:1},def,`${def.name}のじきゅうりょく`);
      if(mon.ability==="マジシャン"&&mon.item==="なし"&&alive(def)&&def.item!=="なし"&&!ITEMS[def.item].stone){ mon.item=def.item; def.item="なし"; log(`　${mon.name}は${def.name}の${mon.item}を奪った！`); }
    }
    if(!alive(mon))break;
  }
  if(anyHit){
    if(M.recoil&&alive(mon)&&mon.ability!=="いしあたま"){
      damage(mon,Math.max(1,Math.floor(totalDealt/M.recoil)),`${mon.name}は反動を受けた`);
    }
    if(mon.item==="いのちのたま"&&totalDealt>0&&alive(mon)){ damage(mon,Math.floor(mon.maxhp/10),`${mon.name}はいのちのたまでHPを削られた`); }
    if(M.self&&alive(mon))applyBoost(mon,M.self,mon,``);
    if(M.fx==="recharge"&&alive(mon))mon.vol.recharge=true;
    if(M.fx==="uturn"&&alive(mon)){
      if(benchMons(p).length){ B.midSwitch={mon, label:name}; }
    }
  }
}
function execStatus(mon,name,M,targetInfo){
  const p=mon.side, fp=foeSide(p), fx=B.sides[p].fx, pos=fieldPos(mon);
  if(mon.item==="とつげきチョッキ"){ log(`　とつげきチョッキのせいで変化技が出せない！`); return; }
  if(M.fx==="boost"||M.fx==="heal50"){
    const sn=B.sides[fp].field.find(m=>alive(m)&&m.vol.snatch);
    if(sn){
      sn.vol.snatch=false;
      log(`　${sn.name}が${name}を横取りした！`);
      if(M.fx==="boost")applyBoost(sn,M.bs,sn,``);
      else { sn.hp=Math.min(sn.maxhp,sn.hp+Math.floor(sn.maxhp/2)); log(`　${sn.name}のHPが回復した！`); }
      return;
    }
  }
  let t=null;
  if(M.rng==="S"||M.rng==="ALLY"){
    const cands=legalTargets(mon,pos,M);
    if(targetInfo.ts>=0&&targetInfo.ts!==null&&B.sides[targetInfo.ts]&&alive(B.sides[targetInfo.ts].field[targetInfo.tp])
       &&cands.some(([s,i])=>s===targetInfo.ts&&i===targetInfo.tp)) t=B.sides[targetInfo.ts].field[targetInfo.tp];
    else { const pool=(M.rng==="S")?cands.filter(([s])=>s===fp):cands; if(pool.length){ const c=pool[Math.floor(Math.random()*pool.length)]; t=B.sides[c[0]].field[c[1]]; } }
    if(!t){ log(`　しかし失敗した！`); return; }
    if(t.side!==p){
      if(B.sides[t.side].fx.crafty){ log(`　${t.name}はトリックガードに守られた！`); return; }
      if(t.ability==="おうごんのからだ"){ log(`　${t.name}はおうごんのからだで防いだ！`); return; }
      if(mon.ability==="いたずらごころ"&&t.types.includes("あく")){ log(`　${t.name}には効かない！（いたずらごころ）`); return; }
      if(t.vol.protect){ log(`　${t.name}はまもっている！`); return; }
      if(M.acc&&Math.random()*100>M.acc){ log(`　${t.name}には当たらなかった！`); return; }
    }
  }
  switch(M.fx){
    case "protect":{
      const n=mon.vol.protCount||0;
      if(Math.random()<Math.pow(1/3,n)){ mon.vol.protect=true; mon.vol.protCount=n+1; mon.vol.protSuccess=true; log(`　${mon.name}は守りの体勢に入った！`); }
      else { mon.vol.protCount=0; log(`　しかし失敗した！`); }
      break; }
    case "wideguard": fx.wide=true; log(`　${mon.name}たちはワイドガードで守られた！`); break;
    case "fastguard": fx.fast=true; log(`　${mon.name}たちはファストガードで守られた！`); break;
    case "followme": mon.vol.redirect=true; if(M.pow)mon.vol.redirectPow=true; log(`　${mon.name}は注目の的になった！`); break;
    case "trickroom":
      if(B.trickroom){B.trickroom=0;log(`　時空が元に戻った！`);}
      else{B.trickroom=5;log(`　${mon.name}は時空をゆがめた！（すばやさが遅い順に行動）`);}
      break;
    case "tailwind": if(fx.tailwind){log(`　しかし失敗した！`);}else{fx.tailwind=4;log(`　P${p}側に追い風が吹き始めた！`);} break;
    case "reflect": if(fx.reflect){log(`　しかし失敗した！`);}else{fx.reflect=mon.item==="ひかりのねんど"?8:5;log(`　P${p}側にリフレクターが張られた！`);} break;
    case "lightscreen": if(fx.light){log(`　しかし失敗した！`);}else{fx.light=mon.item==="ひかりのねんど"?8:5;log(`　P${p}側にひかりのかべが張られた！`);} break;
    case "psyterrain": B.terrain="psy"; B.terrainTurns=5; log(`　足下がふしぎな感じになった！`); break;
    case "sun": setWeather("sun",mon); break;
    case "rain": setWeather("rain",mon); break;
    case "boost": applyBoost(mon,M.bs,mon,``); break;
    case "lower": applyBoost(t,M.bs,mon,``); break;
    case "heal50":{ const h=Math.floor(mon.maxhp/2); mon.hp=Math.min(mon.maxhp,mon.hp+h); log(`　${mon.name}のHPが回復した！`); break; }
    case "lifedew":{ B.sides[p].field.forEach(m=>{ if(alive(m)){ m.hp=Math.min(m.maxhp,m.hp+Math.floor(m.maxhp/4)); } }); log(`　味方全体のHPが回復した！`); break; }
    case "encore":
      if(t.vol.lastMove&&MOVES[t.vol.lastMove]){
        if(t.item==="メンタルハーブ"&&!t.itemUsed){consumeItem(t);log(`　${t.name}はメンタルハーブでアンコールを防いだ！`);break;}
        t.vol.encore=t.vol.lastMove; t.vol.encoreTurns=3; log(`　${t.name}はアンコールを受けた！（${t.vol.lastMove}しか出せない）`); }
      else log(`　しかし失敗した！`);
      break;
    case "taunt":
      if(t.item==="メンタルハーブ"&&!t.itemUsed){consumeItem(t);log(`　${t.name}はメンタルハーブでちょうはつを防いだ！`);break;}
      t.vol.taunt=3; log(`　${t.name}はちょうはつに乗ってしまった！（変化技が出せない）`); break;
    case "helpinghand": t.vol.helpinghand=true; log(`　${mon.name}は${t.name}を助ける体勢に入った！`); break;
    case "instruct":
      if(t.vol.lastMove&&MOVES[t.vol.lastMove]&&MOVES[t.vol.lastMove].cat!=="X"){
        log(`　${mon.name}のさいはい！${t.name}は${t.vol.lastMove}をもう一度使った！`);
        execMove(t,t.vol.lastMove,MOVES[t.vol.lastMove],t.vol.lastTarget||{ts:-1,tp:-1},new Set(),[]);
      } else log(`　しかし失敗した！`);
      break;
    case "yawn": if(!t.status&&!t.vol.yawn){ t.vol.yawn=2; log(`　${t.name}は眠気を誘われた！`); } else log(`　しかし失敗した！`); break;
    case "sleep":
      if(M.pow&&t.types.includes("くさ")){ log(`　${t.name}には効かない！（くさタイプ）`); break; }
      applyStatus(t,"slp",mon); break;
    case "leechseed":
      if(t.types.includes("くさ")){ log(`　${t.name}には効かない！`); break; }
      t.vol.seed=mon.side; log(`　${t.name}にタネを植え付けた！`); break;
    case "trick":{
      if(ITEMS[mon.item].stone||ITEMS[t.item||"なし"].stone){ log(`　しかし失敗した！`); break; }
      const tmp=mon.item; mon.item=t.item; t.item=tmp;
      log(`　${mon.name}は${t.name}と持ち物を入れ替えた！（${mon.item||"なし"}⇔${t.item||"なし"}）`); break; }
    case "coaching": applyBoost(t,{a:1,b:1},mon,`${mon.name}のコーチング`); break;
    case "partingshot":
      applyBoost(t,{a:-1,c:-1},mon,``);
      if(benchMons(p).length){ B.midSwitch={mon, label:name}; }
      break;
    case "roar":{
      const bn=benchMons(t.side);
      if(bn.length){ const nb=bn[Math.floor(Math.random()*bn.length)]; doSwitch(t,nb.name); }
      else log(`　しかし失敗した！`);
      break; }
    case "craftyshield": fx.crafty=true; log(`　${mon.name}たちはトリックガードで変化技から守られた！`); break;
    case "snatch": mon.vol.snatch=true; log(`　${mon.name}は横取りの体勢に入った！`); break;
    case "safeguard": if(fx.safeguard){log(`　しかし失敗した！`);}else{fx.safeguard=5;log(`　P${p}側はしんぴのまもりに包まれた！`);} break;
    case "swagger": applyBoost(t,{a:2},mon,``); addConfusion(t,mon); break;
    case "willowisp": applyStatus(t,"brn",mon); break;
    case "decorate": applyBoost(t,{a:2,c:2},mon,`${mon.name}のデコレーション`); break;
    case "sleeptalk": log(`　しかし失敗した！（眠っている時のみ使える）`); break;
    case "transform":{
      mon.types=t.types.slice(); mon.stats={...t.stats, h:mon.stats.h};
      mon.ability=t.ability; mon.boosts={...t.boosts};
      mon.cfg={...mon.cfg, moves:(t.cfg&&t.cfg.moves?t.cfg.moves.slice():mon.cfg.moves)};
      log(`　${mon.name}は${t.name}にへんしんした！`); break; }
    case "strengthsap":{
      const amt=Math.floor(t.stats.a*boostMul(t.boosts.a));
      mon.hp=Math.min(mon.maxhp,mon.hp+amt);
      applyBoost(t,{a:-1},mon,``);
      log(`　${mon.name}はHPを回復した！`); break; }
    default: log(`　（効果なし）`);
  }
}
function addConfusion(t,src){
  if(t.vol.confusion||!alive(t))return;
  if(src&&src.side!==t.side&&B.sides[t.side].fx.safeguard){ log(`　${t.name}はしんぴのまもりに守られている！`); return; }
  t.vol.confusion=2+Math.floor(Math.random()*3);
  log(`　${t.name}は混乱した！`);
}
function applyStatus(mon,st,src){
  if(mon.status||!alive(mon))return;
  if(st==="brn"&&mon.types.includes("ほのお"))return;
  if(st==="psn"&&(mon.types.includes("どく")||mon.types.includes("はがね")))return;
  if(st==="par"&&mon.types.includes("でんき"))return;
  if(st==="frz"&&mon.types.includes("こおり"))return;
  if(src&&src!==mon&&mon.types.includes("くさ")&&B.sides[mon.side].field.some(m=>alive(m)&&m.ability==="フラワーベール"))return;
  if(src&&src!==mon&&src.side!==mon.side&&B.sides[mon.side].fx.safeguard){ log(`　${mon.name}はしんぴのまもりに守られている！`); return; }
  mon.status=st;
  if(st==="slp")mon.slpTurns=Math.random()<1/3?1:2;
  log(`　${mon.name}は${{brn:"やけどを負った",psn:"どくにおかされた",par:"まひして技が出にくくなった",slp:"眠ってしまった",frz:"凍りついた"}[st]}！`);
  if(mon.item==="ラムのみ"&&!mon.itemUsed){ mon.status=null; consumeItem(mon); log(`　${mon.name}はラムのみで状態異常を治した！`); }
}
function damage(mon,amt,label,ctx){
  if(!alive(mon))return 0;
  amt=Math.min(mon.hp,Math.max(1,Math.floor(amt)));
  if(amt>=mon.hp){
    if(mon.ability==="がんじょう"&&mon.hp===mon.maxhp){ amt=mon.hp-1; log(`　${mon.name}はがんじょうで持ちこたえた！`); }
    else if(mon.item==="きあいのタスキ"&&mon.hp===mon.maxhp&&!mon.itemUsed){ amt=mon.hp-1; consumeItem(mon); log(`　${mon.name}はきあいのタスキで持ちこたえた！`); }
  }
  mon.hp-=amt;
  if(label)log(`　${label}！（${amt}ダメージ）`);
  if(mon.hp<=0){ if(!(ctx&&ctx.noFaint))faint(mon); }
  else if(mon.hp<=mon.maxhp/2&&mon.item==="オボンのみ"&&!mon.itemUsed){
    const blocked=B.sides[foeSide(mon.side)].field.some(m=>alive(m)&&m.ability==="きんちょうかん");
    if(!blocked){ const h=Math.floor(mon.maxhp/4); mon.hp=Math.min(mon.maxhp,mon.hp+h); consumeItem(mon); log(`　${mon.name}はオボンのみでHPを回復した！`); }
  }
  return amt;
}
function faint(mon){
  mon.fainted=true; mon.hp=0;
  log(`　${mon.name}はたおれた！`);
  const pos=fieldPos(mon);
  if(pos>=0)B.sides[mon.side].field[pos]=null;
}
function endOfTurn(){
  if(B.weather){
    B.weatherTurns--;
    if(B.weatherTurns<=0){ log({sun:"日ざしが元に戻った",rain:"雨が上がった",sand:"砂あらしがおさまった"}[B.weather]); B.weather=null; }
    else if(B.weather==="sand"){
      for(const p of [1,2])for(const m of B.sides[p].field){
        if(alive(m)&&!m.types.some(t=>["いわ","じめん","はがね"].includes(t))&&m.ability!=="すながくれ"){
          damage(m,Math.floor(m.maxhp/16),`砂あらしが${m.name}を襲う`);
        }
      }
    }
  }
  if(B.terrain){ B.terrainTurns--; if(B.terrainTurns<=0){B.terrain=null;log("フィールドが元に戻った");} }
  if(B.trickroom){ B.trickroom--; if(B.trickroom<=0)log("時空のゆがみが元に戻った"); }
  for(const p of [1,2]){
    const fx=B.sides[p].fx;
    ["reflect","light","tailwind","safeguard"].forEach(k=>{ if(fx[k]){fx[k]--; if(fx[k]<=0){fx[k]=0;log(`P${p}側の${{reflect:"リフレクター",light:"ひかりのかべ",tailwind:"おいかぜ",safeguard:"しんぴのまもり"}[k]}がなくなった`);} } });
    fx.wide=false; fx.fast=false; fx.crafty=false;
    for(const m of B.sides[p].field){
      if(!alive(m))continue;
      if(m.ability==="あめうけざら"&&B.weather==="rain"){ m.hp=Math.min(m.maxhp,m.hp+Math.floor(m.maxhp/16)); }
      if(B.terrain==="grass"&&grounded(m)){ m.hp=Math.min(m.maxhp,m.hp+Math.floor(m.maxhp/16)); }
      if(alive(m)&&m.ability==="ムラっけ"){
        const ks=["a","b","c","d","s"];
        const up=ks[Math.floor(Math.random()*5)];
        let dn=ks[Math.floor(Math.random()*5)]; while(dn===up)dn=ks[Math.floor(Math.random()*5)];
        const dd={}; dd[up]=2; dd[dn]=-1;
        applyBoost(m,dd,m,`${m.name}のムラっけ`);
      }
      if(m.item==="たべのこし"){ m.hp=Math.min(m.maxhp,m.hp+Math.floor(m.maxhp/16)); }
      if(m.ability==="サンパワー"&&B.weather==="sun")damage(m,Math.floor(m.maxhp/8),`サンパワーで${m.name}のHPが削れた`);
      if(m.status==="brn")damage(m,Math.floor(m.maxhp/16),`${m.name}はやけどのダメージを受けた`);
      if(m.status==="psn")damage(m,Math.floor(m.maxhp/8),`${m.name}はどくのダメージを受けた`);
      if(alive(m)&&m.vol.seed){
        const d=Math.floor(m.maxhp/8); damage(m,d,`やどりぎが${m.name}のHPを奪う`);
        const healers=B.sides[m.vol.seed].field.filter(alive);
        if(healers.length){ const h=healers[0]; h.hp=Math.min(h.maxhp,h.hp+d); }
      }
      if(alive(m)&&m.vol.yawn){ m.vol.yawn--; if(m.vol.yawn<=0&&!m.status){ applyStatus(m,"slp",null); } }
      if(alive(m)&&m.item==="かえんだま"&&!m.status){ applyStatus(m,"brn",m); }
      if(m.vol.encoreTurns){ m.vol.encoreTurns--; if(m.vol.encoreTurns<=0){m.vol.encore=null;log(`${m.name}のアンコールが解けた`);} }
      if(m.vol.taunt){ m.vol.taunt--; if(m.vol.taunt<=0)log(`${m.name}のちょうはつが解けた`); }
      if(!m.vol.protSuccess)m.vol.protCount=0;
      m.vol.protSuccess=false;
      m.vol.protect=false; m.vol.redirect=false; m.vol.redirectPow=false; m.vol.helpinghand=false; m.vol.firstTurn=false; m.vol.snatch=false;
    }
  }
}
function checkWin(){
  const a1=B.sides[1].team.some(m=>!m.fainted), a2=B.sides[2].team.some(m=>!m.fainted);
  if(a1&&a2)return false;
  B.winner=!a1&&!a2?0:(a1?1:2);
  log(`=== ${B.winner===0?"引き分け":"プレイヤー"+B.winner+"の勝ち"}！ ===`);
  B.phase="end"; render();
  return true;
}
/* =============== 途中交代（クイックターン等） =============== */
function rMidSwitch(app){
  const ms=B.midSwitch; const mon=ms.mon;
  let html=`<h1>ターン${B.turn}</h1>`+boardHtml()+
   `<div class="panel"><h2>プレイヤー${mon.side}：${esc(ms.label)}！ ${esc(mon.name)}の交代先を選択</h2>`;
  benchMons(mon.side).forEach(m=>{ html+=`<button onclick="doMidSwitch('${esc(m.name)}')">${esc(m.name)} (HP ${m.hp}/${m.maxhp})</button>`; });
  html+=`</div>`+logHtml();
  app.innerHTML=html;
}
window.doMidSwitch=function(name){
  const mon=B.midSwitch.mon; B.midSwitch=null;
  if(alive(mon)&&fieldPos(mon)>=0)doSwitch(mon,name);
  B.phase="resolve";
  continueResolution();
};
/* =============== ひんし補充 =============== */
function rReplace(app){
  const q=B.replaceQueue[0];
  if(!q){ B.inputPlayer=1; B.phase="handoff"; render(); return; }
  const bench=benchMons(q.p);
  if(bench.length===0){ B.replaceQueue.shift(); rReplace(app); return; }
  let html=`<h1>ターン${B.turn}</h1>`+boardHtml()+
   `<div class="panel"><h2>プレイヤー${q.p}：${POSNAME[q.pos]}に出すポケモンを選択</h2>`;
  bench.forEach(m=>{ html+=`<button onclick="doReplace('${esc(m.name)}')">${esc(m.name)} (HP ${m.hp}/${m.maxhp})</button>`; });
  html+=`</div>`+logHtml();
  app.innerHTML=html;
}
window.doReplace=function(name){
  const q=B.replaceQueue.shift();
  const m=benchMons(q.p).find(x=>x.name===name);
  if(m){ B.sides[q.p].field[q.pos]=m; m.vol.firstTurn=true; log(`P${q.p}は${m.name}を繰り出した！`); onEntry(m); }
  if(B.replaceQueue.length){ render(); }
  else { B.inputPlayer=1; B.phase="handoff"; render(); }
};
/* =============== てだすけ補正 =============== */
const _origCalc=calcDamage;
calcDamage=function(att,def,name,M,opts){
  const r=_origCalc(att,def,name,M,opts);
  if(r.dmg>0&&att.vol.helpinghand){ r.dmg=Math.floor(r.dmg*1.5); }
  return r;
};
render();
</script>
